/* تخزين دائم عبر window.storage (تزامن سحابي عبر الأجهزة من نفس الحساب)
   مع احتياطي IndexedDB ثم الذاكرة إن تعذّر (مثل وضع التصفّح الخاص). */
const STORE = typeof window !== "undefined" && window.storage ? window.storage : function () {
  const __mem = {};
  const hasIDB = typeof indexedDB !== "undefined";
  const DB = "gamelib_db",
    ST = "kv";
  let dbp = null;
  function open() {
    if (!hasIDB) return Promise.reject(new Error("no-idb"));
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(ST);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  function tx(mode, run) {
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction(ST, mode);
      const req = run(t.objectStore(ST));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    }));
  }
  return {
    async get(k) {
      try {
        const v = await tx("readonly", s => s.get(k));
        return v === undefined ? null : {
          key: k,
          value: v
        };
      } catch {
        return k in __mem ? {
          key: k,
          value: __mem[k]
        } : null;
      }
    },
    async set(k, v) {
      try {
        await tx("readwrite", s => s.put(v, k));
      } catch {
        __mem[k] = v;
      }
      return {
        key: k,
        value: v
      };
    },
    async delete(k) {
      try {
        await tx("readwrite", s => s.delete(k));
      } catch {
        delete __mem[k];
      }
      return {
        key: k,
        deleted: true
      };
    },
    async keys() {
      try {
        return await tx("readonly", s => s.getAllKeys());
      } catch {
        return Object.keys(__mem);
      }
    }
  };
}();

    m = Math.floor(s % 3600 / 60),
    x = s % 60;

  return p(h) + ":" + p(m) + ":" + p(x);
};

function buildLadder() {
  const mult = [1, 1.5, 2, 3, 5, 7.5];
  const set = new Set();
  for (let p = 0; p < 8; p++) for (const m of mult) set.add(Math.round(m * Math.pow(10, p)));
  return Array.from(set).sort((a, b) => a - b);
}
const LADDER = buildLadder();
function targetAt(startVal, k) {
  let i = LADDER.findIndex(x => x >= startVal);
  if (i < 0) i = 0;
  const idx = i + k;
  if (idx < LADDER.length) return LADDER[idx];
  const last = LADDER[LADDER.length - 1];
  return last * Math.pow(10, idx - (LADDER.length - 1));
}
function tierColor(k) {
  const c = ["#cd7f32", "#cd7f32", "#cbd5e1", "#cbd5e1", "#f5b942", "#f5b942", "#67e8f9", "#67e8f9", "#a78bfa", "#a78bfa", "#f472b6"];
  return c[Math.min(k, c.length - 1)];
}
function medalName(k) {
  const names = ["برونزي", "فضّي", "ذهبي", "بلاتيني", "ماسي", "أسطوري"];
  return names[Math.min(Math.floor(k / 2), names.length - 1)];
}

/* ============================================================

   مثال: "بطل RPG نينتندو" سلسلة من مستوى 1 → 5 → 10 → 25 …
   ============================================================ */
const TIER_THRESHOLDS = [1, 5, 10, 25, 50, 100, 200, 300, 500, 750];

const FAMILY_KEYS_FOR_TIERS = Object.keys(FAMILIES).filter(f => f !== "other");
const HOUR_TIERS = [10, 25, 50, 100, 200, 500, 1000];

const SERIES = [];

/* مرور واحد على الألعاب يبني كل الإحصاءات التي تحتاجها السلاسل (خفيف وسريع) */
function buildStats(games) {
  const genreFam = {},
    famDone = {},
    famHours = {},
    genreFive = {};
  const genreKeys = Object.keys(GENRE_RX);
  for (const x of games) {
    const fam = familyOf(x.platform);
    const done = x.status === "completed";
    const h = Number(x.hours) || 0;
    const five = Number(x.rating) >= 5;
    famHours[fam] = (famHours[fam] || 0) + h;
    if (done) famDone[fam] = (famDone[fam] || 0) + 1;
    for (const gk of genreKeys) {
      if (!hasGenre(x, gk)) continue;
      if (done) {
        const k = gk + "|" + fam;
        genreFam[k] = (genreFam[k] || 0) + 1;
      }
      if (five) genreFive[gk] = (genreFive[gk] || 0) + 1;
    }
  }
  return {
    genreFam,
    famDone,
    famHours,
    genreFive
  };
}
function computeSeries(s, stats) {
  const v = s.value(stats) || 0;
  const thr = s.thresholds;
  let cleared = 0;
  while (cleared < thr.length && v >= thr[cleared]) cleared++;
  const maxed = cleared >= thr.length;
  const next = maxed ? thr[thr.length - 1] : thr[cleared];
  const prev = cleared > 0 ? thr[cleared - 1] : 0;
  const pct = maxed ? 100 : next > prev ? Math.min(100, (v - prev) / (next - prev) * 100) : 0;
  return {
    ...s,
    value: v,
    cleared,
    maxed,
    next,
    prev,
    pct,
    tiers: thr.length,
    remain: maxed ? 0 : Math.max(0, next - v)
  };
}
function computeTrack(t, games) {
  const v = t.metric(games);
  let cleared = 0;
  while (v >= targetAt(t.start, cleared) && cleared < 300) cleared++;
  const next = targetAt(t.start, cleared);
  const prev = cleared > 0 ? targetAt(t.start, cleared - 1) : 0;
  const pct = next > prev ? Math.min(100, (v - prev) / (next - prev) * 100) : 0;
  return {
    ...t,
    value: v,
    cleared,
    next,
    prev,
    pct,
    remain: Math.max(0, next - v)
  };
}
function computeAchievements(games) {
  const tracks = TRACKS.map(t => computeTrack(t, games));
  const trackTiers = tracks.reduce((s, t) => s + t.cleared, 0);
  const badges = BADGES.map(b => ({
    ...b,
    done: b.check(games)
  }));
  const badgesDone = badges.filter(b => b.done).length;
  const stats = buildStats(games);
  const series = SERIES.map(s => computeSeries(s, stats));
  const seriesTiers = series.reduce((s, x) => s + x.cleared, 0);
  const totalTiers = trackTiers + seriesTiers;
  // كل جزء/هدف مُنجَز في المجموعات (به تختيمة واحدة على الأقل) = +15 نقطة إنجاز
  const partClears = games.reduce((s, g) => s + (g.parts || []).concat(g.goals || []).filter(pt => (pt.runs || []).length > 0).length, 0);
  const chall = monthChallenge(games);
  const gdone = groupsDone(games);
  const points = trackTiers * 25 + badgesDone * 50 + seriesTiers * 20 + partClears * 15 + (chall.done ? 50 : 0) + gdone.length * 40;
  const unlockedKeys = [];
  for (const t of tracks) for (let j = 0; j < t.cleared; j++) unlockedKeys.push("t:" + t.id + ":" + j);
  for (const b of badges) if (b.done) unlockedKeys.push("b:" + b.id);
  for (const s of series) for (let j = 0; j < s.cleared; j++) unlockedKeys.push("s:" + s.id + ":" + j);
  return {
    tracks,
    trackTiers,
    badges,
    badgesDone,
    series,
    seriesTiers,
    totalTiers,
    partClears,
    chall,
    gdone,
    points,
    unlockedKeys
  };
}
function keyLabel(key) {
  const parts = key.split(":");
  if (parts[0] === "t") {

    return {

    return {

      sub: "المستوى " + (ti + 1)
    };

  const b = BADGES.find(x => x.id === parts[1]);
  return {
    icon: b ? b.icon : "🏅",
    title: b ? b.title : "وسام",
    sub: "وسام خاص"
  };
}

// ساعات اللعب الحقيقية = مجموع الجلسات ما عدا التعويضية (backfill)
function realPlayHours(g) {
  return (g.sessions || []).reduce((t, s) => t + (s && s.src !== "backfill" ? Math.max(0, Number(s.ms) || 0) : 0), 0) / 3600000;
}
/* ═══════════ نظام المِران ═══════════
   طبقة محسوبة بالكامل من البيانات الموجودة — لا حقول جديدة ولا ترحيل.
   ثلاثة مقاييس لا غير: الوقت، والتختيم، وإعادة التختيم.
   عدد الألعاب التي تملكها لا يدخل هنا إطلاقًا. */

/* ---------- تصنيف اللعبة: تُختَم أم بلا نهاية؟ ----------
   فيفا والأركيد لا نهاية لهما تُختَم، فقياسهما بالتختيم ظلم لهما.
   يُشتقّ تلقائيًا ويقبل تجاوزًا يدويًا بحقل `endless` (true/false). */
const ENDLESS_GENRES = ["sports", "party"];
function isEndless(g) {
  if (!g) return false;
  if (g.endless === true) return true;
  if (g.endless === false) return false;
  if (g.arcadeMode) return true;
  return ENDLESS_GENRES.some(k => hasGenre(g, k));
}

/* ---------- وسام اللعبة ----------
   أربع درجات، آخرها لا نهائية. مساران بنفس الشكل والقيمة:
   لعبة تُختَم وقودها التختيمات، ولعبة بلا نهاية وقودها الساعات. */
const MEDAL_RUNS = [3, 1, 0];          // أتقنتها · أتممتها · خُضتها (بالتختيمات)
const MEDAL_HOURS_ENDLESS = [100, 25, 5];
const MEDAL_MIN_HOURS = 5;             // «خُضتها» عتبةُ وقت في المسارين
const MEDALS_RUN = [
  { k: "mastered", icon: "🥇", name: "أتقنتها", pts: 400 },
  { k: "beaten",   icon: "🥈", name: "أتممتها", pts: 150 },
  { k: "played",   icon: "🥉", name: "خُضتها",  pts: 50 }
];
const MEDALS_ENDLESS = [
  { k: "mastered", icon: "🥇", name: "أدمنتها", pts: 400 },
  { k: "beaten",   icon: "🥈", name: "لازمتها", pts: 150 },
  { k: "played",   icon: "🥉", name: "خُضتها",  pts: 50 }
];
const GILD_PTS = 300;

/* عدد التختيمات الكاملة للعبة (لا يشمل تختيمات الأجزاء والأهداف — هذه لِلّعبة نفسها) */
const fullRuns = g => ((g && g.playthroughs) || []).length;

/* يرجع { tier, key, icon, name, gild, pts, next } — أو tier:0 إن لم تبلغ شيئًا.
   `gild` عدد التذهيبات: كل 3 تختيمات إضافية، أو كل 100 ساعة إضافية. */
function gameMedal(g) {
  if (!g) return { tier: 0, gild: 0, pts: 0 };
  const endless = isEndless(g);
  const hrs = Math.max(0, realPlayHours(g));
  const set = endless ? MEDALS_ENDLESS : MEDALS_RUN;
  const val = endless ? hrs : fullRuns(g);
  const steps = endless ? MEDAL_HOURS_ENDLESS : MEDAL_RUNS;
  /* «خُضتها» تحتاج ساعات في المسارين — لعبة بتختيمة وبلا وقت مسجّل ما زالت تُتمّ */
  let tier = 0;
  if (val >= steps[0]) tier = 3;
  else if (val >= steps[1] && (!endless ? true : hrs >= MEDAL_MIN_HOURS)) tier = 2;
  else if (hrs >= MEDAL_MIN_HOURS) tier = 1;
  if (tier === 0) return { tier: 0, gild: 0, pts: 0, endless: endless };
  const m = set[3 - tier];
  /* التذهيب يبدأ بعد بلوغ الإتقان */
  const gild = tier < 3 ? 0 : endless
    ? Math.floor((hrs - MEDAL_HOURS_ENDLESS[0]) / MEDAL_HOURS_ENDLESS[0])
    : Math.floor((val - MEDAL_RUNS[0]) / MEDAL_RUNS[0]);
  const pts = set.slice(3 - tier).reduce((s, x) => s + x.pts, 0) + gild * GILD_PTS;
  return { tier: tier, key: m.k, icon: m.icon, name: m.name, gild: gild, pts: pts, endless: endless };
}

/* ---------- دورة الإتقان ----------
   كل تختيمة تُغلق دورة وتفتح التالية، وساعات الدورة الجديدة تعطي مِرانًا أعلى.
   هذا هو السبب الذي يجعلك تعود للعبة ختمتها بدل الانتقال لغيرها.
   الألعاب بلا نهاية دورتها واحدة دائمًا — لا تختيم فيها يفتح دورة. */
const CYCLE_STEP = 0.25;
const cycleOf = g => isEndless(g) ? 1 : fullRuns(g) + 1;
const cycleMult = g => 1 + CYCLE_STEP * (cycleOf(g) - 1);
/* توزيع ساعاتك على الدورات: الجلسة تنتمي للدورة التي كانت مفتوحة وقتها،
   والدورة تُفتح بالتختيمة التي سبقتها. هذا يمنع ضرب ساعات الماضي بمضاعف
   الحاضر — من ختم لعبة أمس لا تتضاعف ساعاته القديمة بأثر رجعي. */
function cycleHours(g) {
  if (!g) return [];
  const hrs = Math.max(0, realPlayHours(g));
  if (isEndless(g)) return hrs > 0 ? [{ cycle: 1, hours: hrs }] : [];
  const runs = ((g.playthroughs || [])
    .map(r => (r && r.date) ? (Date.parse(r.date + "T23:59:59") || 0) : 0)
    .filter(Boolean)).sort((a, b) => a - b);
  const by = {};
  for (const sx of (g.sessions || [])) {
    if (!sx || sx.src === "backfill" || !sx.at) continue;
    const t = Date.parse(sx.at) || 0;
    if (!t) continue;
    let done = 0;
    for (const r of runs) { if (r <= t) done++; else break; }
    const c = done + 1;
    by[c] = (by[c] || 0) + Math.max(0, Number(sx.ms) || 0) / 3600000;
  }
  return Object.keys(by).map(c => ({ cycle: Number(c), hours: by[c] })).sort((a, b) => a.cycle - b.cycle);
}
/* الساعات بعد وزنها بمضاعف دورتها — هذه ما يدخل نقاط الخبرة */
const cycleXpHours = g => cycleHours(g).reduce((t, x) => t + x.hours * (1 + CYCLE_STEP * (x.cycle - 1)), 0);

/* ---------- وسم السَّحب ----------
   لعبة أعطيتها ساعةً فأكثر ثم لم تلمسها شهرًا. اسم الوسم يتحدّد بكم أعطيتها
   لا بكم غبت: ساعتان تُنسى، وأربعون ساعة لا تُنسى.
   ⚠️ الألعاب المختومة والتي بلا نهاية لا تُوسَم — لا سَحبَ على ما أتممته. */
const GHOST_MIN_HOURS = 1;
const GHOST_DAYS = [365, 180, 30];     // سنة · ٦ أشهر · شهر
const GHOST_NAMES = [
  /* [ساعات_من, بعد شهر, بعد ٦ أشهر, بعد سنة] */
  [30, ["🗡️", "الخيانة العظمى"], ["🗡️", "وكنتَ صاحبها"],     ["🏚️", "بيت مهجور"]],
  [10, ["💔", "خيانة"],          ["💔", "خيانة موصوفة"],      ["⚰️", "دفنتها وهي حيّة"]],
  [3,  ["👻", "الساحب"],          ["👻", "الساحب المزمن"],     ["💀", "سحبة العمر"]],
  [0,  ["🤷", "ما ضبطت"],         ["🌫️", "راحت بلا رجعة"],    ["🪦", "نسيت إن عندك إياها"]]
];
/* تحوّل الوسم حين تعود وتختمها — لا يُمحى بل يحمل معه كم غِبت */
const REDEEM_NAMES = [
  [730, ["🏆", "قصّة حبّ متأخّرة"]],
  [365, ["💍", "صالحتها بعد سنة"]],
  [180, ["❤️", "حبّيتها بعد ما سحبت عليها"]],
  [30,  ["💚", "رجعت لها"]]
];
const daysBetween = (a, b) => Math.floor((b - a) / 86400000);

/* يرجع null، أو { state:"ghost"|"redeemed", icon, name, days, hours }.
   `now` معطًى صراحةً حتى تكون الدالة خالصة وقابلة للاختبار. */
function ghostTag(g, now) {
  if (!g || isEndless(g)) return null;
  const hrs = Math.max(0, realPlayHours(g));
  if (hrs < GHOST_MIN_HOURS) return null;
  const t = now == null ? Date.now() : (now instanceof Date ? +now : now);
  const last = Date.parse(g.lastPlayed || "") || 0;
  if (!last) return null;

  const runs = (g.playthroughs || []).filter(r => r && r.date);
  if (runs.length) {
    /* عادت وخُتمت: نقيس الفجوة بين آخر لعب قبل التختيمة وتاريخ التختيمة نفسها */
    const runAt = Math.max(...runs.map(r => Date.parse(r.date + "T12:00:00") || 0));
    const before = (g.sessions || [])
      .map(s => (s && s.at && s.src !== "backfill") ? Date.parse(s.at) || 0 : 0)
      .filter(v => v > 0 && v < runAt - 86400000);
    if (before.length) {
      const gap = daysBetween(Math.max(...before), runAt);
      const hit = REDEEM_NAMES.find(r => gap >= r[0]);
      if (hit) return { state: "redeemed", icon: hit[1][0], name: hit[1][1], days: gap, hours: hrs };
    }
    return null;   /* مختومة بلا هجر يستحق الذكر */
  }

  const gone = daysBetween(last, t);
  if (gone < GHOST_DAYS[2]) return null;
  const col = gone >= GHOST_DAYS[0] ? 3 : gone >= GHOST_DAYS[1] ? 2 : 1;
  const row = GHOST_NAMES.find(r => hrs >= r[0]) || GHOST_NAMES[GHOST_NAMES.length - 1];
  return { state: "ghost", icon: row[col][0], name: row[col][1], days: gone, hours: hrs };
}

/* ═══════════ المِران: العملة والرتب ═══════════ */

/* ---------- صنف التختيمة ----------
   وصفٌ لا حكم. سونيك ١ يُختَم في ساعتين وفاينل فانتسي في ستّين، وأجهزة ما قبل
   بطارية الحفظ صُمّمت لتُختَم بجلسة واحدة — فقِصَر اللعبة تصميمُ عصرها لا نقصٌ فيها.
   لا صنف أشرف من صنف؛ جمعُها كلها هو الإنجاز. */
const RUN_SIZES = [
  [60, "ملحمة", "🐉"], [30, "طويلة", "🏔️"], [10, "متوسطة", "🗺️"],
  [3, "قصيرة", "🎯"], [0, "خاطفة", "⚡"]
];
const runSizeOf = h => RUN_SIZES.find(r => (Number(h) || 0) >= r[0]) || RUN_SIZES[RUN_SIZES.length - 1];
/* كل تختيمات المكتبة مصنَّفةً — التختيمة بلا ساعات تُنسب لساعات اللعبة مقسومةً */
function allRuns(games) {
  const out = [];
  for (const g of (games || [])) {
    if (!g || isShell(g)) continue;
    const runs = g.playthroughs || [];
    const fallback = runs.length ? Math.max(0, realPlayHours(g)) / runs.length : 0;
    for (const r of runs) {
      if (!r) continue;
      const h = Number(r.hours) > 0 ? Number(r.hours) : fallback;
      out.push({ g: g, date: r.date || "", hours: h, size: runSizeOf(h) });
    }
  }
  return out;
}

/* ---------- الجلسة الواحدة ----------
   مجد ألعاب ما قبل الحفظ والأركيد: بدأتَها وأنهيتَها متّصلةً. نكتشفه من الجلسات
   نفسها — جلسة واحدة تغطّي أغلب وقت اللعبة، وتختيمة في يومها أو الذي يليه. */
function beatInOneSitting(g) {
  if (!g || !fullRuns(g)) return false;
  const hrs = Math.max(0, realPlayHours(g));
  if (hrs <= 0) return false;
  const sess = (g.sessions || []).filter(s => s && s.at && s.src !== "backfill" && isSitting(s));
  if (!sess.length) return false;
  const longest = sess.reduce((m, s) => Math.max(m, Number(s.ms) || 0), 0) / 3600000;
  if (longest < hrs * 0.8) return false;              // الجلسة تغطّي 80٪ من وقتها
  const day = localDay(sess.reduce((a, s) => (Number(s.ms) || 0) > (Number(a.ms) || 0) ? s : a).at);
  return (g.playthroughs || []).some(r => {
    if (!r || !r.date) return false;
    const d = Math.abs(Date.parse(r.date + "T12:00:00") - Date.parse(day + "T12:00:00")) / 86400000;
    return d <= 1;
  });
}

/* ---------- وسام الصيد (RetroAchievements) ----------
   مسار مستقلّ بجانب وسام اللعبة لا بديل عنه. RA يغطّي الأجهزة الريترو وحدها،
   فبناء التقدّم الرئيسي عليه كان سيجعل لعبةً على PS5 مواطنًا من الدرجة الثانية
   لسببٍ لا حيلة لها فيه. لذلك: أوسمة الصيد وحدها تضيف مِرانًا، لا عدد الإنجازات الخام. */
const HUNT_MEDALS = [
  { k: "clean",  icon: "🔥", name: "إتقان صافٍ",  pts: 150 },
  { k: "set",    icon: "💎", name: "إتقان الطقم", pts: 250 },
  { k: "half",   icon: "🏅", name: "نصف الطريق",  pts: 80 },
  { k: "opened", icon: "🎖️", name: "فتحتَ الصيد", pts: 30 }
];
function huntMedal(g) {
  if (!raShows(g)) return { tier: 0, pts: 0, gild: 0 };
  const tot = raTotalCount(g), got = raEarnedCount(g);
  if (!tot || !got) return { tier: 0, pts: 0, gild: 0 };
  const hc = Number((g.ra || {}).numAwardedHardcore) || 0;
  const mastered = got >= tot;
  const clean = mastered && hc >= tot;
  const gild = Math.max(0, raMasteries(g) - 1);       // إعادة الإتقان بعد الأولى
  let tier = 1;                                       // فتحتَ الصيد
  if (mastered) tier = clean ? 4 : 3;
  else if (got * 2 >= tot) tier = 2;
  const m = HUNT_MEDALS[4 - tier];
  const pts = HUNT_MEDALS.slice(4 - tier).reduce((s, x) => s + x.pts, 0) + gild * 200;
  return { tier: tier, key: m.k, icon: m.icon, name: m.name, pts: pts, gild: gild, got: got, total: tot };
}

/* ---------- نقاط المِران ----------
   ثلاثة مقاييس لا غير: الوقت، والتختيم، وإعادة التختيم.
   ⚠️ الاقتناء صفر — اللعبة غير المُشغَّلة لا تعطي شيئًا مهما كان جهازها أو ثمنها. */
const MIRAN_PER_HOUR = 10;
const RUN_PTS = [100, 150, 225, 340, 500];   /* التختيمة الخامسة فصاعدًا 500 بلا حدّ للعدد */
function runPoints(n) {
  let t = 0;
  for (let i = 0; i < (Number(n) || 0); i++) t += RUN_PTS[Math.min(i, RUN_PTS.length - 1)];
  return t;
}
/* مكافأة الفداء: العودة للعبة هجرتها وختمها أثقل من ختم لعبة جديدة، لأنك
   تغلّبتَ على شيء آخر غير اللعبة. تزيد بطول ما هجرتَها، وتُمنح مرة واحدة
   لأن `ghostTag` يقيس أطول فجوة سبقت تختيمةً. */
const REDEEM_PTS = [400, 300, 200, 100];   /* يطابق REDEEM_NAMES بالترتيب */
function redeemBonus(g) {
  const t = ghostTag(g);
  if (!t || t.state !== "redeemed") return 0;
  const i = REDEEM_NAMES.findIndex(r => t.days >= r[0]);
  return i < 0 ? 0 : REDEEM_PTS[i];
}
function miranOfGame(g) {
  if (!g || isShell(g)) return 0;
  let m = MIRAN_PER_HOUR * Math.max(0, cycleXpHours(g));
  m += runPoints(fullRuns(g));
  m += gameMedal(g).pts;
  m += huntMedal(g).pts;
  m += redeemBonus(g);
  return Math.round(m);
}
const miranGames = games => (games || []).reduce((t, g) => t + miranOfGame(g), 0);
const MIRAN_TITLE_PTS = 1000;
/* رصيد المِران = الألعاب + الألقاب + الانتظام (التحديات والسلسلة). الانتظام
   محور مستقل: مِران الألعاب يقيس الكمّ ولا يفرّق بين مئة ساعة في أسبوع ومئة
   على سنة. ⚠️ مسار الموسم ليس هنا عمدًا — هو عرضٌ لنشاط الربع لا رصيد ثانٍ. */
const miranTotal = games => miranGames(games) + earnedTitles(games).length * MIRAN_TITLE_PTS
  + challengeMiran(games) + streakMiran(games);

/* ---------- سُلَّم لا نهائي مسمّى ----------
   يبني على rankOn ويكمل بنجوم بعد آخر رتبة مسمّاة، فلا يقف التقدّم أبدًا. */
function endlessRank(ladder, score, step) {
  const s = Math.max(0, Number(score) || 0);
  const top = ladder[ladder.length - 1];
  if (s < top[0]) {
    const r = rankOn(ladder, s);
    return { score: s, name: r.name, icon: r.icon, stars: 0, pct: r.pct, next: r.next, nextAt: r.nextAt };
  }
  const stars = Math.floor((s - top[0]) / step);
  const into = (s - top[0]) % step;
  return {
    score: s, name: top[1], icon: top[2], stars: stars,
    pct: Math.min(100, into / step * 100),
    next: top[1] + " " + "⭐".repeat(Math.min(3, stars + 1)), nextAt: top[0] + (stars + 1) * step
  };
}

/* رتبة المِران — تحلّ محلّ خمسة سلالم: المستوى ورتبة اللعب ورتبتَي العالمين والأركيد */
const MIRAN_RANKS = [
  [0, "عابر", "🚶"], [500, "صاحب جلسة", "🎮"], [1300, "مُواظِب", "📅"],
  [2600, "مُتمرّس", "🎯"], [4500, "ابن الصنعة", "🧩"], [7200, "غوّاص", "🤿"],
  [11000, "مُتقِن", "💠"], [16000, "أُسطى", "⚒️"], [23000, "مُعلّم", "📜"],
  [32000, "شيخ المِران", "🕯️"], [45000, "أسطورة حيّة", "🐉"], [62000, "خالد", "☄️"]
];
const MIRAN_STAR = 25000;
const miranRankOf = games => endlessRank(MIRAN_RANKS, miranTotal(games), MIRAN_STAR);
/* عدد صحيح تصاعدي يمثّل درجتك — يحلّ محلّ رقم المستوى في سجل الترقّي والاحتفال،
   فالمقارنة «هل ارتقيتُ؟» تحتاج رقمًا لا اسمًا. */
function miranTier(games) {
  const r = miranRankOf(games);
  const i = MIRAN_RANKS.findIndex(x => x[1] === r.name);
  return (i < 0 ? 0 : i) + 1 + (r.stars || 0);
}
/* الاسم والأيقونة من الدرجة — الاتجاه المعاكس، لعرض إدخالات السجل القديمة */
function miranTierName(tier) {
  const i = Math.max(1, Number(tier) || 1) - 1;
  if (i < MIRAN_RANKS.length) return { name: MIRAN_RANKS[i][1], icon: MIRAN_RANKS[i][2], stars: 0, fresh: true };
  const top = MIRAN_RANKS[MIRAN_RANKS.length - 1];
  return { name: top[1], icon: top[2], stars: i - MIRAN_RANKS.length + 1, fresh: false };
}

/* ---------- سلّم الرفّ ----------
   ساعاتك في ألعاب القصّة التي لم تختمها. جهدٌ حقيقي جلستَه، وما ينقصه إلا الاسم.
   ⚠️ هذه هويّة واعتراف لا نقاط مضاعفة — الساعات محسوبة في المِران أصلًا.
   والألعاب بلا نهاية مستثناة: لا تأخير في ما لا يُختَم. */
const SHELF_RANKS = [
  [0, "رفّك فاضي", "✨"], [25, "خبير الشاشة الافتتاحية", "🎬"], [75, "صديق الفصل الأول", "📖"],

  [1000, "شيخ التسويف", "🧙"], [1500, "أسطورة «إن شاء الله أكمّلها»", "☄️"]
];
const isPending = g => !!g && !isShell(g) && !isEndless(g) && fullRuns(g) === 0 && realPlayHours(g) >= 1;
const shelfHours = games => (games || []).filter(isPending).reduce((t, g) => t + realPlayHours(g), 0);

/* ═══════════ الألقاب ═══════════
   اثنا عشر لقبًا عامًّا وأربعة للصيد — لا أكثر. قلّتها هي قيمتها: نظام شخصي بلا
   جمهور، فاللقب ليس ما تعرضه للناس بل ما تُعرّف به نفسك، وأن يكون بين مئتَي لعبة
   ثلاثٌ مذهّبة هو ما يجعل التذهيب يعني شيئًا لك.
   ولا واحد من الاثني عشر يذكر جهازًا ولا يحتاج حساب RetroAchievements. */
const yearOf = v => String(v || "").slice(0, 4);
/* السنوات التي لعبتَ فيها لعبةً بعينها */
function playYears(g) {
  const y = new Set();
  for (const s of ((g && g.sessions) || [])) if (s && s.at && s.src !== "backfill") y.add(yearOf(localDay(s.at)));
  for (const r of ((g && g.playthroughs) || [])) if (r && r.date) y.add(yearOf(r.date));
  y.delete("");
  return y.size;
}
/* مجموع ساعات محور واحد: نوع أو عائلة جهاز أو حقبة */
function axisHours(games, pick) {
  const m = {};
  for (const g of (games || [])) {
    if (!g || isShell(g)) continue;
    const k = pick(g);
    if (!k) continue;
    m[k] = (m[k] || 0) + Math.max(0, realPlayHours(g));
  }
  return m;
}
const maxOf = m => Object.keys(m).reduce((b, k) => Math.max(b, m[k]), 0);
const genreHours = games => {
  const m = {};
  for (const g of (games || [])) {
    if (!g || isShell(g)) continue;
    const h = Math.max(0, realPlayHours(g));
    if (h <= 0) continue;
    for (const k of Object.keys(GENRE_RX)) if (hasGenre(g, k)) m[k] = (m[k] || 0) + h;
  }
  return m;
};

/* ═══════════ البصمات ═══════════

   HowLongToBeat، بخلاف اللقب الذي يجب أن يكون في متناول كل لاعب. */

/* نسبة ساعاتك لمعدّل HowLongToBeat للعبة — المعيار العادل الوحيد لمقارنة
   سونيك ١ بفاينل فانتسي: كلٌّ يُقاس بنفسه لا بغيره. */
function ttbRatio(g) {
  const t = Number(g && (g.ttbMain || g.ttbFull)) || 0;
  const h = Math.max(0, realPlayHours(g));
  return (t > 0 && h > 0) ? h / t : 0;
}
const beatenGames = games => (games || []).filter(g => g && !isShell(g) && fullRuns(g) > 0);
const redeemedGames = games => (games || []).filter(g => {

});

function predictFinish(game, all){
  if(!game || game.status==="completed" || runsCountOf(game)>0) return null;
  const now=Date.now(), span=14*86400000;
  const recent=(game.sessions||[]).filter(s=>s.src!=="backfill"&&now-new Date(s.at).getTime()<=span);
  if(!recent.length) return null;
  const pace=recent.reduce((t,s)=>t+s.ms/3600000,0)/14;   // ساعات/يوم على مدى أسبوعين
  if(pace<=0.05) return null;
  const gg=(game.genre||"").split("،")[0].split(",")[0].trim();
  const firstRunH=g=>{ const r=[...(g.playthroughs||[])][0]; return r?Number(r.hours)||0:0; };
  const med=a=>{ const s=a.filter(x=>x>0).sort((x,y)=>x-y); return s.length?s[Math.floor(s.length/2)]:0; };
  const done=(all||[]).filter(g=>runsCountOf(g)>0);
  /* ⚠️ كان هذا يتجاهل `ttbMain` ويخترع هدفًا من وسيط تختيماتك، فيظهر سطران
     متجاوران في نفس التبويب: «3س58د / 11س (36٪)» أي 7 ساعات متبقية، و«~2 س
     متبقية» — ثلاثة أضعاف الفرق لنفس السؤال. المعدّل العالمي هو الهدف حين
     يتوفّر، والوسيط بديلٌ عند غيابه لا منافسٌ له. */
  let target = Number(game.ttbMain) > 0 ? Number(game.ttbMain)
    : (med(done.filter(g=>(g.genre||"").includes(gg)&&gg).map(firstRunH)) || med(done.map(firstRunH)) || 12);
  const rem = target - Math.max(0, realPlayHours(game));
  if(rem<=0) return "🔥 يبدو أنك في المراحل الأخيرة — الختم قريب جدًا!";
  const days=Math.ceil(rem/pace);
  if(days>60) return "🔮 بمعدلك الحالي يحتاج الختم أكثر من شهرين (~"+Math.round(rem)+" س متبقية) — كثّف الجلسات 😉";
  return "🔮 توقع الختم: خلال ~"+days+" "+(days>10?"يومًا":"أيام")+" بمعدلك الحالي (~"+Math.round(rem)+" س متبقية تقريبًا)";
}

/* سُلَّم رتب واحد يخدم كل الرتب المستقلّة (اللعب، الأركيد، عالما الأجهزة).
   كان هذا المنطق منسوخًا حرفيًا في دالتين، وكل رتبة جديدة كانت ستنسخه ثالثة

function rankOn(ladder, score) {
  const s = Math.max(0, Number(score) || 0);
  let idx = 0;
  for (let i = 0; i < ladder.length; i++) if (s >= ladder[i][0]) idx = i;
  const cur = ladder[idx], next = ladder[idx + 1] || null;
  const into = s - cur[0], need = next ? next[0] - cur[0] : 0;
  return { score: s, name: cur[1], icon: cur[2], tier: idx + 1, next: next ? next[1] : null, nextAt: next ? next[0] : null, pct: next ? Math.min(100, into / need * 100) : 100 };
}

const COVER_W = 300; // عرض الغلاف بالبكسل
const COVER_Q = 0.5; // جودة JPEG
const COVER_BIG = 16000; // عتبة "صورة كبيرة" (أحرف base64) تستحق إعادة الضغط
function compressSrc(src, maxW = COVER_W, quality = COVER_Q) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#0c0d17";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = src;
  });
}
function fileToDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function compressImage(file, maxW = COVER_W, quality = COVER_Q) {
  const d = await fileToDataURL(file);
  return compressSrc(d, maxW, quality);
}

const lrNorm = s => String(s || "")
  .replace(/\([^)]*\)/g, " ")
  .replace(/\s*[:\-–—]\s*/g, " ")
  .toLowerCase()
  .replace(/[^a-z0-9\u0600-\u06FF ]/g, "")
  .replace(/\s+/g, " ").trim();
/* "The Legend of Zelda - Ocarina" ⇄ "Legend of Zelda, The - Ocarina" */
const lrVariants = n => {
  const out = [lrNorm(n)];
  const m = String(n).match(/^(The|A|An)\s+(.+)$/i);
  if (m) { const r = m[2], i = r.search(/\s*[:\-]\s*/);
    out.push(lrNorm(i > 0 ? r.slice(0, i) + ", " + m[1] + r.slice(i) : r + ", " + m[1])); }
  const c = String(n).match(/^(.+?),\s*(The|A|An)(\s|$)/i);
  if (c) out.push(lrNorm(c[2] + " " + c[1]));

};
/* ترجيح النسخة: أمريكية > عالمية > أوروبية، وتُستبعد النسخ التجريبية */
const lrScore = f => {
  if (/\((Beta|Proto|Demo|Sample|Unl|Aftermarket|Pirate|Program|Test)/i.test(f)) return -1e6;
  let s = 0;
  if (/\(USA/i.test(f)) s += 100; else if (/\(World/i.test(f)) s += 80;
  else if (/\(Europe/i.test(f)) s += 60; else if (/\(Japan/i.test(f)) s += 20;
  s -= (f.match(/\(/g) || []).length * 2;           /* الأنظف أولًا */
  if (/\(Rev /i.test(f)) s += 1;                     /* المراجعة الأحدث أفضل قليلًا */
  return s;
};
const LR_CACHE = new Map();

async function lrIndex(sys) {
  if (LR_CACHE.has(sys)) return LR_CACHE.get(sys);
  let idx = null;
  try {
    const saved = await sget(LR_KEY(sys));
    if (saved && saved.v === 1 && saved.m) idx = new Map(saved.m);
  } catch (e) {}
  if (!idx) {
    try {
      const r = await fetch("https://api.github.com/repos/libretro-thumbnails/" + sys +
        "/git/trees/master:Named_Boxarts");
      if (r.ok) {
        const j = await r.json();
        idx = new Map();
        for (const t of j.tree || []) {
          if (!/\.png$/i.test(t.path)) continue;
          const file = t.path.replace(/\.png$/i, "");
          const key = lrNorm(file);
          const prev = idx.get(key);
          if (!prev || lrScore(file) > lrScore(prev)) idx.set(key, file);
        }
        try { await sset(LR_KEY(sys), { v: 1, m: [...idx] }); } catch (e) {}
      }
    } catch (e) {}
  }
  LR_CACHE.set(sys, idx);
  return idx;
}
/* يعيد رابط غلاف الريترو أو "" */
async function libretroCover(name, platform) {
  const sys = LR_SYS[platform];
  if (!sys || !name) return "";
  const idx = await lrIndex(sys);
  if (!idx || !idx.size) return "";
  for (const v of lrVariants(name)) {
    const hit = idx.get(v);
    if (hit) return "https://raw.githubusercontent.com/libretro-thumbnails/" + sys +
      "/master/Named_Boxarts/" + encodeURIComponent(hit) + ".png";
  }
  return "";
}

   (PS2، PSP، N64، NDS، GBA، Game Boy، Atari 2600). خطأ 19.

   1) تطابق تامّ أولًا عبر كل الأجهزة — يحسم PS1 مقابل PS2.

const raDigits = s => (String(s).match(/\d+/g) || []).join(",");

  const wanted = (RA_ALIASES[platformName] || []).map(raKeyNorm).filter(Boolean);
  if (!wanted.length) return null;
  const rows = (consoles || []).map(c => ({
    id: c.ID != null ? c.ID : c.id,
    key: raKeyNorm(c.Name || c.name || "")
  })).filter(r => r.key && r.id != null);
  /* 1) تطابق تامّ */
  for (const w of wanted) {
    const hit = rows.find(r => r.key === w);
    if (hit) return hit.id;
  }
  /* 2) احتواء بشرط تطابق الأرقام */
  const cands = [];
  for (const w of wanted) {
    const wd = raDigits(w);
    for (const r of rows) {
      if (!r.key.includes(w)) continue;
      if (raDigits(r.key) !== wd) continue;   // جيل مختلف — ارفض
      cands.push(r);

  }

  cands.sort((a, b) => a.key.length - b.key.length);
  return cands[0].id;

        const h = Math.max(1, Math.round(img.height * scale));

  const [raOne, setRaOne] = useState({ id: "", state: "idle", err: "" });       // تحديث لعبة واحدة
  const [raBulk, setRaBulk] = useState({ state: "idle", i: 0, total: 0, changed: 0, err: "" });

  /* يكتب نتيجة RA على لعبة واحدة: الإنجازات وسجل التكرار فقط.
     لا يلمس hours ولا sessions ولا status ولا dateAdded — هذه ملك العدّاد اليدوي. */
  const raApplyAchievements = useCallback(async (localId, gid, prog) => {
    if (!prog) return null;
    const cur = gamesRef.current;
    const g = cur.find(x => x.id === localId);
    if (!g) return null;
    const prevRa = g.ra || null;
    const nextRa = {
      gameId: gid, title: prog.title, consoleName: prog.consoleName,
      numAchievements: prog.numAchievements, numAwarded: prog.numAwarded,
      numAwardedHardcore: prog.numAwardedHardcore, completion: prog.completion,
      guideUrl: prog.guideUrl || (prevRa && prevRa.guideUrl) || "",
      achievements: prog.achievements, syncedAt: prog.syncedAt
    };
    const merged = raMergeHistory(g.raHist, prevRa, nextRa);
    const next = cur.map(x => x.id === localId ? { ...x, raGameId: gid, ra: nextRa, raHist: merged.hist } : x);
    setGames(next);
    gamesRef.current = next;
    try { await sset(KEY_GAMES, next); } catch {}
    setDetail(p => p && p.game.id === localId ? { ...p, game: next.find(x => x.id === localId) } : p);
    return merged;
  }, []);

  /* تحديث إنجازات لعبة مرتبطة — يدوي دائمًا، طلب واحد */
  const raRefreshGame = useCallback(async localId => {
    const u = raUserRef.current, k = raKeyRef.current;
    const g = gamesRef.current.find(x => x.id === localId);
    if (!g || !g.raGameId) return;
    if (!u || !k) { setRaOne({ id: localId, state: "error", err: "أضف اسم المستخدم والمفتاح من الإعدادات أولًا" }); return; }
    setRaOne({ id: localId, state: "running", err: "" });
    try {
      const prog = await raGameProgress(g.raGameId, u, k);
      const res = await raApplyAchievements(localId, g.raGameId, prog);
      if (!res) { setRaOne({ id: localId, state: "error", err: "ما رجعت بيانات لهذه اللعبة" }); return; }
      syncUnlocks(gamesRef.current, true);
      setRaOne({ id: localId, state: "done", err: "", newEarns: res.newEarns, reEarns: res.reEarns });
    } catch (e) {
      setRaOne({ id: localId, state: "error", err: "تعذّر الاتصال بـRetroAchievements" });
    }
  }, [raApplyAchievements]);

  /* فتح نافذة الربط: نجلب قائمة ألعاب منصّة اللعبة (مخزَّنة مؤقتًا) ونبحث فيها محليًا */
  const raOpenPick = useCallback(async game => {
    const u = raUserRef.current, k = raKeyRef.current;
    const seed = { gameId: game.id, name: game.name, platform: game.platform, q: game.name, results: [], all: null, err: "" };
    if (!u || !k) { setRaPick({ ...seed, state: "nocreds" }); return; }
    setRaPick({ ...seed, state: "loading" });
    try {
      const consoles = await raConsoles(u, k);
      const cid = raMatchConsoleId(consoles, game.platform);
      if (!cid) { setRaPick(p => p && { ...p, state: "unsupported" }); return; }
      const list = await raGames(cid, u, k);
      setRaPick(p => p && { ...p, state: "ready", all: list, results: raSearchGames(list, game.name, 25) });
    } catch (e) {
      setRaPick(p => p && { ...p, state: "error", err: "تعذّر جلب قائمة ألعاب المنصّة" });
    }
  }, []);
  const raPickSearch = useCallback(q => {
    setRaPick(p => p && { ...p, q: q, results: p.all ? raSearchGames(p.all, q, 25) : [] });
  }, []);

  /* اختيار المستخدم — هنا وحده يُكتب raGameId. لا شيء آخر يربط لعبة بـRA. */
  /* ملاحظة: نقرأ raPick من الإغلاق لا من دالة تحديث setRaPick — دالة التحديث
     في React 18 تُؤجَّل للرِندر التالي، فقراءة القيمة منها ترجع فارغة ويتوقف
     الربط عند «جاري جلب إنجازاتك» بلا أي طلب. */
  const raConfirmPick = useCallback(async raGid => {
    const u = raUserRef.current, k = raKeyRef.current;
    const localId = raPick && raPick.gameId;
    if (!localId) return;
    setRaPick(p => p && { ...p, state: "linking", err: "" });
    try {
      const prog = await raGameProgress(raGid, u, k);
      const res = await raApplyAchievements(localId, raGid, prog);
      if (!res) { setRaPick(p => p && { ...p, state: "ready", err: "ما قدرنا نقرأ تقدّمك في هذه اللعبة" }); return; }
      syncUnlocks(gamesRef.current, true);
      setRaPick(null);
    } catch (e) {
      setRaPick(p => p && { ...p, state: "ready", err: "تعذّر الاتصال — جرّب مرة ثانية" });
    }
  }, [raPick, raApplyAchievements]);

  /* فك الارتباط: يمسح بيانات RA ويُبقي `raHist` — تاريخ تكرارك لا يُمحى أبدًا،
     فلو أعدت الربط لنفس اللعبة يكمل العدّ من حيث وقف. */
  const raUnlink = useCallback(async localId => {
    const next = gamesRef.current.map(g => {
      if (g.id !== localId) return g;
      const c = { ...g, raGameId: "" };
      delete c.ra;
      return c;
    });
    setGames(next);
    gamesRef.current = next;
    try { await sset(KEY_GAMES, next); } catch {}
    setDetail(p => p && p.game.id === localId ? { ...p, game: next.find(x => x.id === localId) } : p);
  }, []);

  /* تحديث كل الألعاب المرتبطة — يدوي من الإعدادات. طلب واحد لكل لعبة مرتبطة فقط،
     فالتكلفة تتناسب مع ما ربطتَه أنت لا مع حجم حسابك في RA. */

  /* ---------- سحب مباشر لكل ألعاب المحاكي ----------
     يمرّ على كل لعبة محاكي في مكتبتك: المرتبطة تُحدَّث إنجازاتها، وغير المرتبطة
     يُبحث عن مطابق تامّ لاسمها داخل قائمة منصّتها في RA فتُربَط تلقائيًا.
     ما لا يُطابَق تمامًا يُترك لك للربط اليدوي بدل تخمينٍ يسحب إنجازات لعبة أخرى.
     ⚠️ لا يضيف ولا لعبة واحدة للمكتبة ولا يكتب أي وقت لعب — إنجازات فقط. */
  const raPullAll = useCallback(async () => {
    const u = raUserRef.current, k = raKeyRef.current;
    if (!u || !k) { setRaBulk({ state: "error", i: 0, total: 0, err: "أضف اسم المستخدم والمفتاح أولًا" }); return; }
    const emus = gamesRef.current.filter(g => g && raSupportedPlatform(g.platform) && !isShell(g));
    if (!emus.length) { setRaBulk({ state: "done", i: 0, total: 0, err: "", none: true }); return; }
    setRaBulk({ state: "running", i: 0, total: emus.length, linked: 0, updated: 0, nomatch: 0, unsupported: 0, failed: 0, err: "" });
    const tally = { linked: 0, updated: 0, nomatch: 0, unsupported: 0, failed: 0 };
    const misses = [];
    let consoles = null;
    const listCache = new Map();   // منصّة → قائمة ألعابها (فوق تخزين raGames المؤقّت)
    for (let i = 0; i < emus.length; i++) {
      const g = emus[i];
      setRaBulk(p => ({ ...p, i: i + 1, ...tally }));
      try {
        let gid = g.raGameId;
        /* غير مرتبطة: ابحث عن مطابق تامّ داخل قائمة منصّتها */
        if (!gid) {
          if (!consoles) consoles = await raConsoles(u, k);
          const cid = raMatchConsoleId(consoles, g.platform);
          if (!cid) { tally.unsupported++; misses.push(g.name + " — منصّة غير مدعومة"); continue; }
          if (!listCache.has(cid)) listCache.set(cid, await raGames(cid, u, k));
          const hits = raExactMatches(listCache.get(cid), g.name);
          if (!hits.length) { tally.nomatch++; misses.push(g.name); continue; }
          gid = hits[0].id;
        }
        const prog = await raGameProgress(gid, u, k);
        const res = await raApplyAchievements(g.id, gid, prog);
        if (!res) { tally.failed++; continue; }
        if (g.raGameId) tally.updated++; else tally.linked++;
      } catch (e) {
        tally.failed++;
      }
      await new Promise(r => setTimeout(r, 260));   // احترام حدود RA
    }
    try { await sset(KEY_GAMES, gamesRef.current); } catch (e) {}
    syncUnlocks(gamesRef.current, true);
    setRaBulk({ state: "done", i: emus.length, total: emus.length, ...tally, misses: misses.slice(0, 12), err: "" });
  }, [raApplyAchievements]);

  const [bulk, setBulk] = useState({ state: "idle", i: 0, total: 0 });
  /* التحديث الشامل: `all=true` يعيد جلب كل شيء (بما فيه ما له بيانات) ويستبدل الغلاف
     بغلاف مطابق للمنصّة. الافتراضي يكمّل الناقص فقط.
     السرعة: تنفيذ متوازٍ محدود (6 ألعاب معًا) بدل واحدة تلو الأخرى، وحفظ واحد بالنهاية
     بدل حفظ كامل المكتبة بعد كل لعبة (كان هذا أبطأ شيء مع مكتبة كبيرة). */
  const BULK_CONCURRENCY = 6;
  const bulkEnrich = useCallback(async (all) => {
    const targets = all
      ? gamesRef.current.slice()
      : gamesRef.current.filter(g => !g.desc || !g.year || !g.developer || !coversRef.current[g.id]);
    if (!targets.length) {
      setBulk({ state: "done", i: 0, total: 0 });
      return;
    }
    setBulk({ state: "running", i: 0, total: targets.length });
    const patches = new Map();
    let done = 0, cursor = 0;
    const worker = async () => {
      while (cursor < targets.length) {
        const t = targets[cursor++];
        try {
          const r = await fetchGameEnrichment(t.name, rawgRef.current, t.platform, { skipTrailer: true, year: t.year });
          if (Number(t.ttbMain) > 0 && r) delete r.ttbMain;
          const { coverUrl, ...fields } = r;
          const extra = {};
          /* الغلاف: نستبدله في الوضع الشامل ليطابق المنصّة، وإلا نملأ الناقص فقط */
          if (coverUrl && (all || !coversRef.current[t.id])) {
            const ok = await applyCover(t.id, coverUrl);
            if (ok) extra.hasCover = true;
          }
          patches.set(t.id, { ...fields, ...extra });
        } catch {}
        done++;
        setBulk({ state: "running", i: done, total: targets.length });
      }
    };
    await Promise.all(Array.from({ length: Math.min(BULK_CONCURRENCY, targets.length) }, worker));
    if (patches.size) {
      const list = gamesRef.current.map(g => patches.has(g.id) ? { ...g, ...patches.get(g.id) } : g);
      setGames(list);
      gamesRef.current = list;
      try { await sset(KEY_GAMES, list); } catch {}
    }
    setBulk({ state: "done", i: targets.length, total: targets.length });
  }, [applyCover]);
  const [ttbBulk, setTtbBulk] = useState({ state: "idle", i: 0, total: 0, ok: 0 });
  const bulkTtb = useCallback(async () => {
    const key = rawgRef.current;
    if (!key) { alert("أضف مفتاح RAWG أولًا من هذا التبويب ليعمل جلب أوقات التختيم."); return; }
    const targets = gamesRef.current.filter(g => !(Number(g.ttbMain) > 0));
    if (!targets.length) { setTtbBulk({ state: "done", i: 0, total: 0, ok: 0 }); return; }
    setTtbBulk({ state: "running", i: 0, total: targets.length, ok: 0 });
    let ok = 0;
    const norm = x => String(x || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    for (let i = 0; i < targets.length; i++) {
      const t = targets[i];
      try {
        const sj = await (await fetch("https://api.rawg.io/api/games?key=" + key + "&search=" + encodeURIComponent(t.name) + "&page_size=5")).json();
        const rs = sj.results || [];
        const hit = rs.find(r => norm(r.name) === norm(t.name)) || rs.find(r => relates(t.name, r.name)) || null;
        const pt = hit ? Number(hit.playtime) || 0 : 0;
        if (pt > 0) {
          ok++;
          const list = gamesRef.current.map(g => g.id === t.id && !(Number(g.ttbMain) > 0) ? { ...g, ttbMain: pt } : g);
          setGames(list); gamesRef.current = list;
        }
      } catch {}
      setTtbBulk({ state: "running", i: i + 1, total: targets.length, ok });
      await new Promise(r => setTimeout(r, 250));
    }
    try { await sset(KEY_GAMES, gamesRef.current); } catch {}
    setTtbBulk({ state: "done", i: targets.length, total: targets.length, ok });
  }, []);
  const handleEnrich = useCallback(async (id, patch) => {
    const {
      coverUrl,
      ...fields
    } = patch;
    let extra = {};
    if (coverUrl) {
      const ok = await applyCover(id, coverUrl);
      if (ok) extra.hasCover = true;
    }
    const cur = gamesRef.current;
    const list = cur.map(g => g.id === id ? {
      ...g,
      ...fields,
      ...extra
    } : g);
    setGames(list);
    gamesRef.current = list;
    await sset(KEY_GAMES, list);
    setDetail(p => p && p.game.id === id ? {
      ...p,
      game: {
        ...p.game,
        ...fields,
        ...extra
      },
      cover: coversRef.current[id] || p.cover
    } : p);
  }, [applyCover]);


  // تحميل الأغلفة تدريجيًا في الخلفية وبتزامن محدود (يحترم حدود معدّل التخزين السحابي
  // فلا تتكدّس عشرات الطلبات معًا وتُعلّق التطبيق). كل قراءة مغلّفة بحمايتها الخاصة.
  const loadCoversProgressively = useCallback(async list => {
    const withCover = [{ id: "nsohub" }, ...list.filter(g => g.hasCover)];
    const LIMIT = 4; // عدد الأغلفة المقروءة في الدُفعة الواحدة
    for (let i = 0; i < withCover.length; i += LIMIT) {
      const batch = withCover.slice(i, i + LIMIT);
      const results = await Promise.all(batch.map(async g => {
        try {
          const c = await sget(coverKey(g.id));
          return [g.id, c];
        } catch {
          return [g.id, null];
        }
      }));
      setCovers(prev => {
        const n = {
          ...prev
        };
        for (const [id, c] of results) if (c) n[id] = c;
        return n;
      });
      // إفساح المجال للواجهة بين الدُفعات حتى يبقى التطبيق متجاوبًا
      await new Promise(r => setTimeout(r, 0));
    }
  }, []);
  useEffect(() => {
    (async () => {
      let list = null;
      try {
        list = await sget(KEY_GAMES);
        if (Array.isArray(list)) {
          const migRes = migrateGamesList(list);
          list = migRes.games;
          let mig = migRes.changed;
          /* أُلغي استيراد RA: نزيل ما خلّفه ونحذف أغلفة ما حُذف، ثم نخبر
             المستخدم بالعدد بدل أن تختفي ألعاب من مكتبته بصمت. */
          if (migRes.purge && (migRes.purge.removed.length || migRes.purge.stripped)) {
            const p = migRes.purge;
            await Promise.all(p.removed.map(id => sdel(coverKey(id)).catch(() => {})));
            setPurgeNote({ removed: p.removed.length, stripped: p.stripped, hours: p.hoursDropped });
          }
          const rec = reconcileGamesTime(list);
          if (rec.changed) { list = rec.games; mig = true; }
          // ترحيل لمرة واحدة: ربط Sonic Generations كلعبة داخلية ضمن Sonic X Shadow Generations
          {
            const bp = list.find(x => x.id === "mr61pn7vf27s7k"), bc = list.find(x => x.id === "mrc7h1y7vbqor4");
            if (bp && bc && !bc.parentId) { list = list.map(x => x.id === bc.id ? { ...x, parentId: bp.id } : x); mig = true; }
          }
          // ترحيل لمرة واحدة: إنشاء Sonic Origins كلعبة أم وضمّ ألعابها الخمس داخلها
          {
            const SO_ID = "sonicoriginsbundle";
            const soKids = ["son1split01", "soncdsplit02", "son2split03", "son3split04", "songgsplit05"].filter(id => list.some(x => x.id === id && !x.parentId));
            if (soKids.length > 0 && !list.some(x => x.id === SO_ID)) {
              const k0 = list.find(x => x.id === soKids[0]);
              list = [{
                ...blankGame(),
                id: SO_ID,
                name: "Sonic Origins",
                platform: k0.platform,
                hardware: k0.hardware || "original",
                type: k0.type,
                source: k0.source || "",
                status: "playing",
                genre: "Platformer",
                year: "2022",
                developer: "SEGA، Sonic Team",
                group: "Sonic Origins",
                dateAdded: k0.dateAdded || localDay(new Date())
              }, ...list.map(x => soKids.includes(x.id) ? { ...x, parentId: SO_ID } : x)];
              mig = true;
            }
          }
          if (mig) await sset(KEY_GAMES, list);
        }
      } catch {
        list = null;
      }
      if (!list || !Array.isArray(list)) {
        list = [];
      }
      setGames(list);
      gamesRef.current = list;
      try { const ns = await sget(KEY_NSOSUB); if (ns && typeof ns === "object") setNsoSub({ plan: ns.plan || "expansion", expiry: ns.expiry || "" }); } catch {}
      // أساس الإنجازات (بدون احتفال عند التحميل)
      try {
        const keys = computeAchievements(list).unlockedKeys;
        const stored = await sget(KEY_UNLOCKED);
        if (Array.isArray(stored)) unlockedRef.current = new Set(stored);else {
          unlockedRef.current = new Set(keys);
          await sset(KEY_UNLOCKED, keys);
        }
      } catch {}
      // افتح الواجهة فورًا — لا ننتظر تحميل كل الأغلفة (هذا ما كان يُعلّق شاشة التحميل)
      setLoaded(true);
      // ثم حمّل الأغلفة تدريجيًا في الخلفية وتظهر على البطاقات تباعًا
      loadCoversProgressively(list);
    })();
  }, [loadCoversProgressively]);
  useEffect(() => {
    if (!celebrate.length) return;
    const t = setTimeout(() => setCelebrate([]), 5200);
    return () => clearTimeout(t);
  }, [celebrate]);
  const syncUnlocks = useCallback((list, celebrateOn) => {
    /* realGames هنا ضروري: شاشة الإنجازات تحسب من realGames، فحسابُ المفاتيح
       من القائمة الخام يجعل المحفوظ يخالف المعروض. */
    const keys = computeAchievements(realGames(list)).unlockedKeys;
    const base = unlockedRef.current;
    const fresh = keys.filter(k => !base.has(k));
    unlockedRef.current = new Set(keys);
    sset(KEY_UNLOCKED, keys);
    if (celebrateOn && fresh.length) setCelebrate(fresh.slice(0, 4).map(keyLabel));
  }, []);
  /* مصدر واحد لفتح الإنجازات: أي تغيّر في المكتبة مهما كان مصدره.
     كانت خمس دوال (addPlayTime، completeFromTimer، addPlaythrough،
     logScoreAttempt، deleteRun) لا تستدعي syncUnlocks — وهي بالضبط الطرق التي
     تُفتح بها الإنجازات فعلًا — فلا يظهر احتفال عند الاستحقاق، ويبقى
     KEY_UNLOCKED قديمًا حتى تُعدّل أي لعبة فتنفجر الاحتفالات المتأخّرة معًا.
     الأول بعد التحميل صامت: يصحّح الأساس بلا انفجار متراكم. */
  const unlockPrimed = useRef(false);
  useEffect(() => {
    if (!loaded) return;
    syncUnlocks(games, unlockPrimed.current);
    unlockPrimed.current = true;
  }, [games, loaded, syncUnlocks]);
  const recompressCovers = useCallback(async (opts = {}) => {
    const force = !!opts.force;
    const onProgress = opts.onProgress;
    const entries = Object.entries(coversRef.current);
    const targets = entries.filter(([id, d]) => d && (force || d.length > COVER_BIG));
    let before = 0,
      after = 0,
      changed = 0;
    for (let i = 0; i < targets.length; i++) {
      const [id, d] = targets[i];
      before += d.length;
      try {
        const nd = await compressSrc(d, COVER_W, COVER_Q);
        if (nd && nd.length < d.length) {
          after += nd.length;
          changed++;
          await sset(coverKey(id), nd);
          setCovers(p => ({
            ...p,
            [id]: nd
          }));
        } else {
          after += d.length;
        }
      } catch {
        after += d.length;
      }
      if (onProgress) onProgress(i + 1, targets.length);
      await new Promise(r => setTimeout(r, 0)); // إفساح المجال للواجهة
    }
    await sset(KEY_IMGVER, IMG_VER);
    return {
      before,
      after,
      changed,
      total: targets.length
    };
  }, []);

  // تشغيل تلقائي مرة واحدة: ضغط الأغلفة الكبيرة القديمة في الخلفية
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      const iv = await sget(KEY_IMGVER);
      if (!iv || iv < IMG_VER) recompressCovers({
        force: false
      });
    })();
  }, [loaded, recompressCovers]);

@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&display=swap');

/* ============================================================

:root{
  --bg:#07080e; --bg-1:#0a0c14;
  --s1:#101220; --s2:#161a2b; --s3:#1e2233; --s4:#272c40;
  --line:#232741; --line-2:#31374f; --line-3:#434a68;
  --txt:#edeffc; --txt-2:#a4aacb; --txt-3:#6e7595; --txt-4:#4d5474;
  --gold-ink:#231704;
  --violet:#a78bfa; --violet-2:#6d4cff; --cyan:#22d3ee; --cyan-2:#7de3ff;
  --green:#4ade80; --red:#fb7185; --amber:#fbbf24;
  --r1:10px; --r2:14px; --r3:18px; --r4:24px; --rf:999px;
  --sh1:0 1px 3px #0007;
  --sh2:0 10px 30px -10px #000c;
  --sh3:0 28px 70px -18px #000, 0 0 0 1px #ffffff08;
  --ring:0 0 0 3px color-mix(in srgb,var(--gold) 15%,transparent);
  --ease:cubic-bezier(.2,.7,.2,1);
}
* { box-sizing:border-box; margin:0; padding:0; }
.app {
  font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;

    radial-gradient(880px 520px at -12% 8%, color-mix(in srgb, #0a2b3d var(--bm), var(--bb)) 0%, transparent 52%),

/* ---------- الشريط العلوي ---------- */

  background:linear-gradient(var(--bg) 20%, color-mix(in srgb, #07080ecc var(--bm), var(--bb)) 70%, transparent); backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4); }

.ml-fill { height:100%; background:linear-gradient(90deg,var(--gold-3),var(--gold-2)); box-shadow:0 0 8px color-mix(in srgb,var(--gold) 56%,transparent); }

/* ---------- التبويبات الرئيسية ---------- */

.search::placeholder { color:var(--txt-4); }
.search:focus { outline:none; border-color:color-mix(in srgb,var(--gold) 53%,transparent); box-shadow:var(--ring); background:var(--s1); }
.filters { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:9px; align-items:center; }
.chip { padding:6px 12px; border-radius:var(--rf); border:1px solid var(--line-2); background:transparent; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; transition:.14s var(--ease); white-space:nowrap; }

.filt-sep { width:1px; height:20px; background:var(--line-2); margin:0 3px; }

.grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); }
.bg-hero { position:fixed; inset:-40px; z-index:-1; background-size:cover; background-position:center 20%; filter:blur(52px) brightness(.28) saturate(1.35); opacity:.5; pointer-events:none; }

/* ---------- استمر من حيث توقفت ---------- */
.resume { display:flex; flex-direction:column; gap:9px; background:linear-gradient(150deg,color-mix(in srgb, #20182fdd var(--bm), var(--bb)),color-mix(in srgb, #0f111ddd var(--bm), var(--bb))); border:1px solid color-mix(in srgb,var(--gold) 25%,transparent); border-radius:var(--r3); padding:12px 13px; box-shadow:var(--sh2), inset 0 1px 0 color-mix(in srgb,var(--gold) 10%,transparent); }

.arcade-rail .rtile-cv { border:1.5px solid transparent; background-image:linear-gradient(var(--well),var(--well)),linear-gradient(135deg,#ff5fa2,#7c5cff,#22d3ee); background-origin:border-box; background-clip:padding-box, border-box; box-shadow:0 0 0 1px rgba(124,92,255,.18), var(--sh1); }

@keyframes arcpulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }

/* ---------- الرفوف ---------- */
.shelves { display:flex; flex-direction:column; gap:20px; }

.shelf-row { display:grid; grid-auto-flow:column; grid-auto-columns:158px; gap:12px; overflow-x:auto; padding:4px 2px 12px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; }

/* ---------- تحدي الشهر ---------- */
.chall-card { background:linear-gradient(150deg,color-mix(in srgb, #1e1740 var(--bm), var(--bb)),var(--surf-2)); border:1px solid #a78bfa4d; border-radius:var(--r3); padding:15px; display:flex; flex-direction:column; gap:5px; box-shadow:var(--sh2), inset 0 1px 0 #a78bfa22; }

/* ---------- بطاقة اللعبة ---------- */
.card { text-align:right; cursor:pointer; padding:0; overflow:hidden; background:linear-gradient(180deg,var(--s1),var(--card-2)); border:1px solid var(--line); border-radius:var(--r3); font-family:inherit; color:inherit;
  transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s; display:flex; flex-direction:column;
  box-shadow:var(--sh1); content-visibility:auto; contain-intrinsic-size:auto 290px; }

.fab { position:fixed; bottom:22px; left:22px; z-index:40; width:60px; height:60px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(140deg,var(--gold-2),var(--gold) 45%,#ff8a3c); color:var(--gold-ink); font-size:32px; font-weight:700; line-height:1;
  box-shadow:0 14px 36px -8px color-mix(in srgb,var(--gold) 44%,transparent), inset 0 1px 0 #fff6; transition:.2s var(--ease); }
.fab:hover { transform:scale(1.07) rotate(90deg); box-shadow:0 18px 44px -8px color-mix(in srgb,var(--gold) 56%,transparent), inset 0 1px 0 #fff8; }
.fab:active { transform:scale(.96) rotate(90deg); }

/* ---------- النوافذ والنماذج ---------- */
.modal-backdrop { position:fixed; inset:0; z-index:50; background:color-mix(in srgb, #04050ad9 var(--bm), var(--bb)); backdrop-filter:blur(10px) saturate(.8); -webkit-backdrop-filter:blur(10px); display:flex; align-items:flex-start; justify-content:center; padding:20px 12px; overflow-y:auto; }
.modal { width:100%; max-width:520px; background:linear-gradient(180deg,var(--panel),var(--panel-2)); border:1px solid var(--line-2); border-radius:var(--r4); overflow:hidden; box-shadow:var(--sh3); animation:mpop .26s var(--ease); }

.modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:color-mix(in srgb, #13162af2 var(--bm), var(--bb)); backdrop-filter:blur(12px); z-index:2; }

.icon-btn { background:var(--s3); border:1px solid var(--line-2); color:var(--txt-2); width:32px; height:32px; border-radius:10px; cursor:pointer; font-size:15px; transition:.14s; }
.icon-btn:hover { background:var(--s4); color:var(--ink); }
.modal-body { padding:16px 18px; display:flex; flex-direction:column; gap:13px; }
.modal-foot { display:flex; align-items:center; gap:9px; padding:14px 18px; border-top:1px solid var(--line); position:sticky; bottom:0; background:color-mix(in srgb, #13162af2 var(--bm), var(--bb)); backdrop-filter:blur(12px); }
.cover-row { display:flex; gap:12px; align-items:flex-start; background:var(--s1); border:1px solid var(--line); border-radius:var(--r3); padding:12px; }

.cover-prev { width:96px; height:128px; flex-shrink:0; border-radius:var(--r2); overflow:hidden; background:radial-gradient(130% 110% at 50% 0%,color-mix(in srgb, #1b1f36 var(--bm), var(--bb)),var(--deep) 72%); border:1px solid var(--line-2); display:flex; align-items:center; justify-content:center; cursor:zoom-in; box-shadow:var(--sh2); }

.cover-prev:hover img { transform:scale(1.3); }
.cover-tools { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.cover-tools .btn { width:100%; }
.cover-actions { display:flex; flex-direction:column; gap:8px; flex:1; }
.field { display:flex; flex-direction:column; gap:6px; }

.field input, .field select, .field textarea { width:100%; padding:11px 13px; border-radius:var(--r1); background:var(--well); border:1px solid var(--line); color:var(--ink); font-family:inherit; font-size:16px; transition:.14s; }
.field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:color-mix(in srgb,var(--gold) 53%,transparent); box-shadow:var(--ring); }
.field textarea { resize:vertical; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.seg-label { font-size:12.5px; color:var(--txt-2); font-weight:700; margin-bottom:-4px; }
.seg { display:flex; gap:6px; background:var(--well); border:1px solid var(--line); border-radius:var(--r1); padding:4px; }

.seg button.on { background:linear-gradient(180deg,var(--s3),var(--s2)); color:var(--ink); border-color:var(--line-3); box-shadow:0 2px 8px -2px #000c; }
.status-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.status-btn { padding:11px; border-radius:var(--r1); border:1px solid var(--line); background:var(--well); color:var(--txt-3); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:.14s var(--ease); }

/* ---------- الأزرار ---------- */
.btn { padding:11px 16px; border-radius:var(--r1); border:1px solid transparent; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:700; transition:.14s var(--ease); }
.btn.primary { background:linear-gradient(140deg,var(--gold-2),var(--gold) 50%,#ff9a3c); color:var(--gold-ink); box-shadow:0 6px 18px -6px color-mix(in srgb,var(--gold) 44%,transparent), inset 0 1px 0 #fff6; }

.btn.ghost { background:var(--s3); color:var(--txt-2); border-color:var(--line-2); }
.btn.ghost:hover { background:var(--s4); color:var(--ink); }
.btn.ghost.danger { color:var(--red); }
.btn.danger { background:#fb71851f; color:var(--red); border-color:#fb718555; }

.btn.auto { background:linear-gradient(140deg,var(--violet),var(--violet-2)); color:var(--ink); display:flex; align-items:center; justify-content:center; gap:6px; box-shadow:0 6px 18px -6px #6d4cff80; }

.auto-msg { font-size:12px; padding:7px 10px; border-radius:9px; text-align:center; }

.detail-grid { display:flex; flex-direction:column; gap:6px; font-size:13.5px; color:var(--txt-2); }

.runs-box { display:flex; flex-direction:column; gap:8px; background:var(--well); border:1px solid var(--line); border-radius:var(--r2); padding:13px; }
.runs-head { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--txt-2); font-weight:700; }

.run-row { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--txt-2); }
.run-star { color:var(--gold); letter-spacing:-2px; flex-shrink:0; }
