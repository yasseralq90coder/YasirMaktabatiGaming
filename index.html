.comp-row label { flex:1; display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--txt-2); }
.comp-row input { padding:10px; border-radius:var(--r1); background:var(--well); border:1px solid var(--line); color:var(--ink); font-family:inherit; font-size:16px; }

/* ---------- المؤقّت ---------- */
.timer-clock { font-family:'Chakra Petch',sans-serif; font-size:38px; font-weight:800; text-align:center; letter-spacing:2px; font-variant-numeric:tabular-nums; background:linear-gradient(180deg,var(--ink),var(--gold-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.timer-clock.run { animation:tpulse 1.6s ease-in-out infinite; }
@keyframes tpulse { 0%,100%{opacity:1} 50%{opacity:.55} }
.timer-btns { display:flex; gap:10px; }
.timer-btns .btn { flex:1; }
.timer-edit p { font-size:13px; color:var(--txt-2); margin:0 0 8px; }
.timer-edit-row { display:flex; gap:10px; margin-bottom:10px; }
.timer-edit-row label { flex:1; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--txt-2); }
.timer-edit-row input { flex:1; width:100%; padding:10px; border-radius:var(--r1); background:var(--well); border:1px solid var(--line); color:var(--ink); font-family:inherit; font-size:16px; text-align:center; }
.trailer-empty { display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; padding:24px 12px; border:1px dashed var(--line-2); border-radius:var(--r2); color:var(--txt-2); font-size:13px; }
.trailer-tools { display:flex; gap:10px; }
.trailer-tools .btn { flex:1; text-decoration:none; display:flex; align-items:center; justify-content:center; }
.trailer-paste { display:flex; gap:8px; }
.trailer-paste input { flex:1; padding:11px 12px; border-radius:var(--r1); background:var(--well); border:1px solid var(--line); color:var(--ink); font-family:inherit; font-size:16px; }
.trailer-paste input:focus { outline:none; border-color:color-mix(in srgb,var(--gold) 53%,transparent); box-shadow:var(--ring); }
.bk-progress { height:8px; border-radius:var(--rf); background:var(--well); overflow:hidden; margin-top:4px; box-shadow:inset 0 1px 2px #000a; }
.bk-progress-fill { height:100%; background:linear-gradient(90deg,var(--violet-2),var(--violet)); transition:width .25s; }

/* ---------- الإحصائيات والمستوى ---------- */
.stats { display:flex; flex-direction:column; gap:14px; }
.level-card { display:flex; align-items:center; gap:18px; padding:20px; background:linear-gradient(150deg,color-mix(in srgb, #1e1840 var(--bm), var(--bb)),#12142400 60%), linear-gradient(180deg,var(--s2),var(--s1)); border:1px solid #3a3468; border-radius:var(--r4); box-shadow:var(--sh2), inset 0 1px 0 #ffffff0f; }
.rank-emoji { font-size:52px; filter:drop-shadow(0 6px 20px color-mix(in srgb,var(--gold) 44%,transparent)); }
.level-info { flex:1; }
.rank-name { font-size:21px; font-weight:800; letter-spacing:-.5px; }
.level-num { font-family:'Chakra Petch',sans-serif; font-size:13px; color:var(--gold); margin:3px 0 11px; font-variant-numeric:tabular-nums; }
.xp-bar { height:11px; background:var(--deep); border-radius:var(--rf); overflow:hidden; border:1px solid var(--line); box-shadow:inset 0 2px 4px #000c; }
.xp-fill { height:100%; background:linear-gradient(90deg,var(--gold-3),var(--gold-2)); border-radius:var(--rf); transition:width .6s var(--ease); box-shadow:0 0 12px color-mix(in srgb,var(--gold) 50%,transparent); }
.xp-text { font-size:11.5px; color:var(--txt-3); margin-top:8px; }
.stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:11px; }
/* صفّ ثانوي: عدّادات التقدّم لا تنافس أرقام مكتبتك في الحجم — ستة مربّعات
   متساوية كانت تعني أن لا شيء منها مهم. */
.miran-strip{ display:flex; gap:6px; margin-top:8px; padding:8px 10px; border:1px solid var(--hair); border-radius:var(--r2); background:var(--e1); }
.mn-cell{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:1px; text-align:center; }
.mn-cell b{ font-family:var(--num); font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; }
.mn-cell span{ font-size:10px; color:var(--txt-4); }
.stat { background:linear-gradient(180deg,var(--s1),var(--card-2)); border:1px solid var(--line); border-radius:var(--r3); padding:17px 8px; text-align:center; box-shadow:var(--sh1); transition:.18s var(--ease); }
.stat:hover { border-color:var(--line-3); transform:translateY(-2px); }
.stat-n { font-family:'Chakra Petch',sans-serif; font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; }
.stat-l { font-size:11px; color:var(--txt-3); margin-top:5px; }

.next-card { background:linear-gradient(150deg, color-mix(in srgb, var(--tc) 18%, var(--s1)), var(--card-2)); border:1px solid var(--tc); border-radius:var(--r3); padding:16px; box-shadow:var(--sh2); }
.next-label { font-size:12px; font-weight:800; color:var(--tc); margin-bottom:10px; letter-spacing:.3px; }
.next-row { display:flex; align-items:center; gap:14px; }
.next-ic { font-size:40px; filter:drop-shadow(0 4px 12px #0009); }
.next-info { flex:1; }
.next-title { font-size:15px; font-weight:800; }
.next-bar { height:10px; background:var(--deep); border-radius:var(--rf); overflow:hidden; margin:9px 0 6px; box-shadow:inset 0 2px 4px #000c; }
.next-fill { height:100%; border-radius:var(--rf); transition:width .6s var(--ease); background:linear-gradient(90deg, var(--tc,#6d4cff), var(--violet)); box-shadow:0 0 10px -1px var(--tc,#6d4cff); }
.next-sub { font-size:12px; color:var(--txt-2); }
.next-sub b { color:var(--ink); }

.section-title { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:800; letter-spacing:-.2px; margin-top:4px; border-right:3px solid var(--violet-2); padding-right:10px; }
.ach-count { font-family:'Chakra Petch',sans-serif; font-size:12px; color:var(--gold); background:color-mix(in srgb,var(--gold) 10%,transparent); border:1px solid color-mix(in srgb,var(--gold) 20%,transparent); padding:3px 10px; border-radius:var(--rf); }

/* ---------- المسارات ---------- */
.track-list { display:flex; flex-direction:column; gap:10px; }
.sgroup { margin-bottom:12px; border:1px solid var(--line); border-radius:var(--r3); background:var(--card-2); overflow:hidden; box-shadow:var(--sh1); }
.sgroup-head { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px; background:linear-gradient(180deg,var(--s2),var(--s1)); border:none; color:var(--ink); font-family:inherit; font-size:14px; font-weight:800; cursor:pointer; text-align:right; transition:.14s; }
.sgroup-head:hover { background:linear-gradient(180deg,var(--s3),var(--s2)); }
.sgroup-title { font-weight:800; }
.sgroup-meta { font-size:11.5px; color:var(--txt-2); font-weight:700; white-space:nowrap; }
.sgroup-arrow { margin-right:6px; color:var(--txt-3); }
.sgroup .track-list { padding:12px; }
.sgroup-empty { font-size:12.5px; color:var(--txt-3); padding:6px 2px; }
.sgroup-toggle { margin-top:4px; font-size:12.5px; }
.track { display:flex; gap:13px; padding:14px; border-radius:var(--r3); border:1px solid var(--line); background:linear-gradient(180deg,var(--s1),var(--card-2)); backdrop-filter:blur(4px); overflow-wrap:break-word; word-break:break-word; box-shadow:var(--sh1); }
.track-ic { font-size:28px; width:34px; text-align:center; }
.track-body { flex:1; min-width:0; }
.track-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.track-title { font-size:14px; font-weight:800; }
.track-medal { font-size:11px; font-weight:800; color:var(--tc); background:color-mix(in srgb, var(--tc) 16%, transparent); border:1px solid var(--tc); padding:2px 9px; border-radius:var(--rf); white-space:nowrap; }
.track-blurb { font-size:11.5px; color:var(--txt-3); margin:3px 0 8px; }
.track-bar { height:8px; background:var(--deep); border-radius:var(--rf); overflow:hidden; box-shadow:inset 0 1px 3px #000a; }
.track-fill { height:100%; background:var(--tc); border-radius:var(--rf); transition:width .6s var(--ease); box-shadow:0 0 8px -1px var(--tc); }
.track-foot { display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--txt-2); margin-top:7px; }

.ach-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:11px; }
.ach { display:flex; gap:12px; padding:13px; border-radius:var(--r2); border:1px solid var(--line); background:var(--s1); }
.ach.done { border-color:color-mix(in srgb,var(--gold) 33%,transparent); background:linear-gradient(140deg,color-mix(in srgb,var(--gold) 8%,transparent),var(--s1)); }
.atabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.atabs::-webkit-scrollbar { display:none; }
.atab { flex:0 0 auto; padding:9px 15px; border-radius:var(--rf); background:var(--s1); border:1px solid var(--line-2); color:var(--txt-3); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:.2s var(--ease); white-space:nowrap; }
.atab:hover { border-color:var(--line-3); color:var(--txt-2); }
.atab.on { background:linear-gradient(140deg,var(--violet),var(--violet-2)); border-color:transparent; color:var(--ink); box-shadow:0 8px 20px -8px #6d4cffcc; transform:translateY(-1px); }
.atab.guide-btn { border-color:color-mix(in srgb,var(--gold) 40%,transparent); color:var(--gold); margin-inline-start:auto; }
.runs-list { display:flex; flex-direction:column; gap:10px; }
.runs-empty { text-align:center; color:var(--txt-2); font-size:13.5px; padding:32px 12px; border:1px dashed var(--line-2); border-radius:var(--r2); }
.ach-run-name, .ach-run-sub, .ach-run-foot, .track-tt b, .gcard-name { unicode-bidi:plaintext; }
.ach-run-sub { line-height:1.9; word-spacing:1px; }
.ach-run-name { font-size:15px; letter-spacing:.2px; }
.ach-cover { width:58px; height:76px; flex-shrink:0; border-radius:var(--r2); padding:3px; position:relative; overflow:hidden; }
.ach-cover img { width:100%; height:100%; object-fit:cover; border-radius:10px; position:relative; z-index:1; }
.ach-cover-ic { display:flex; align-items:center; justify-content:center; width:100%; height:100%; font-size:26px; position:relative; z-index:1; }
.ach-cover::before { content:""; position:absolute; inset:-40%; animation:spinGrad 3.2s linear infinite; }
.ach-cover.gold::before { background:conic-gradient(var(--gold-3), #fff3c4, #b8860b, var(--gold-2), var(--gold-3)); }
.ach-cover.silver::before { background:conic-gradient(#c0c6d8, #ffffff, color-mix(in srgb, #8a90a8 var(--bm), var(--bb)), #e6eaf5, #c0c6d8); }
.ach-cover.gold { box-shadow:0 0 20px -2px color-mix(in srgb,var(--gold) 56%,transparent); }
@keyframes spinGrad { to { transform:rotate(360deg); } }

/* ---------- المجموعات والحزم ---------- */
.card-grp { font-size:11px; color:var(--violet); font-weight:700; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-partlbl { position:absolute; bottom:0; right:0; left:0; z-index:2; padding:16px 8px 7px; font-size:12px; font-weight:800; color:var(--ink); text-align:center; background:linear-gradient(#0000,color-mix(in srgb, #04050ae6 var(--bm), var(--bb)) 60%); text-shadow:0 1px 4px #000; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; pointer-events:none; }
.group-box { border:1px solid #a78bfa4d; background:linear-gradient(150deg,#a78bfa14,var(--card-2)); border-radius:var(--r3); padding:13px; display:flex; flex-direction:column; gap:8px; font-size:13.5px; }
.card-bundle { position:absolute; bottom:9px; right:9px; z-index:2; background:color-mix(in srgb, #06070cd9 var(--bm), var(--bb)); border:1px solid #38bdf877; color:color-mix(in srgb, #aee6ff var(--tm), var(--tb)); font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:var(--rf); backdrop-filter:blur(6px); }
.bundle-parent { display:flex; align-items:center; gap:6px; border:1px dashed #38bdf888; background:#38bdf812; color:color-mix(in srgb, #cdeeff var(--tm), var(--tb)); border-radius:var(--r2); padding:12px; font-size:13px; font-weight:700; width:100%; text-align:right; cursor:pointer; font-family:inherit; transition:.14s; }
.bundle-parent:hover { background:#38bdf81f; }
.bundle-box { border:1px solid #38bdf84d; background:linear-gradient(150deg,#38bdf812,var(--card-2)); border-radius:var(--r3); padding:13px; display:flex; flex-direction:column; gap:10px; }
.bundle-head { font-weight:800; font-size:13.5px; color:var(--txt); }
.bundle-empty { font-size:12px; color:var(--txt-2); line-height:1.6; }
.bundle-total { font-size:12.5px; color:color-mix(in srgb, #cdeeff var(--tm), var(--tb)); }
.nso-art { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; background:radial-gradient(circle at 50% 35%, #e6001230, var(--well) 70%); color:color-mix(in srgb, #ff7b84 var(--tm), var(--tb)); font-size:15px; letter-spacing:1px; }
.nsohub-top { display:flex; gap:12px; align-items:flex-start; }
.nsohub-cv { position:relative; width:96px; flex-shrink:0; aspect-ratio:3/4; border-radius:var(--r2); overflow:hidden; background:radial-gradient(circle at 50% 35%, #e6001230, var(--well) 70%); display:flex; align-items:center; justify-content:center; font-size:34px; cursor:pointer; border:1px solid #e6001255; box-shadow:var(--sh2); }
.nsohub-cv img { width:100%; height:100%; object-fit:cover; }
.nsohub-cvlbl { position:absolute; bottom:0; right:0; left:0; background:color-mix(in srgb, #06070cd9 var(--bm), var(--bb)); color:var(--ink); font-size:9.5px; font-weight:700; text-align:center; padding:4px 2px; backdrop-filter:blur(6px); }
.nsohub-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; font-size:13px; }
.sess-note-in { width:100%; background:var(--well); border:1px solid var(--line); color:var(--ink); border-radius:var(--r1); padding:10px; font-family:inherit; font-size:16px; margin:8px 0 2px; resize:vertical; }
.ttb-box { border:1px solid #a78bfa4d; background:linear-gradient(150deg,#a78bfa10,var(--card-2)); border-radius:var(--r3); padding:13px; display:flex; flex-direction:column; gap:9px; }
.ttb-row { display:flex; flex-direction:column; gap:5px; }
.ttb-lbl { display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; }
.ttb-lbl span { color:var(--txt-2); font-weight:600; }
.queue-btn { border:1px dashed #22d3ee77; background:#22d3ee10; color:color-mix(in srgb, #a5f3ff var(--tm), var(--tb)); border-radius:var(--r2); padding:12px; font-size:13px; font-weight:700; width:100%; cursor:pointer; font-family:inherit; transition:.14s; }
.queue-btn:hover { background:#22d3ee1f; }
.queue-btn.on { border-style:solid; background:#22d3ee22; }
.queue-strip { display:flex; flex-direction:column; gap:9px; background:linear-gradient(150deg,color-mix(in srgb, #0c2230dd var(--bm), var(--bb)),color-mix(in srgb, #0f111ddd var(--bm), var(--bb))); border:1px solid #22d3ee44; border-radius:var(--r3); padding:11px 12px; box-shadow:var(--sh2), inset 0 1px 0 #22d3ee1a; }

/* ---------- حلقة معدل الإنجاز ---------- */
.cring-card { display:flex; align-items:center; gap:12px; background:linear-gradient(150deg,color-mix(in srgb, #1e1728dd var(--bm), var(--bb)),color-mix(in srgb, #0f111ddd var(--bm), var(--bb))); border:1px solid color-mix(in srgb,var(--gold) 25%,transparent); border-radius:var(--r3); padding:11px 12px; margin-bottom:10px; box-shadow:var(--sh2), inset 0 1px 0 color-mix(in srgb,var(--gold) 10%,transparent); }
.cring { width:60px; height:60px; flex:none; transform:rotate(-90deg); }
.cring-bg { fill:none; stroke:#20243a; stroke-width:6; }
.cring-fg { fill:none; stroke:var(--gold); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .7s var(--ease); filter:drop-shadow(0 0 4px color-mix(in srgb,var(--gold) 50%,transparent)); }
.cring-t { fill:var(--gold-2); font-size:13px; font-weight:800; text-anchor:middle; transform:rotate(90deg); transform-origin:30px 30px; font-family:inherit; }
.cring-info { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; font-size:12.5px; color:var(--txt-2); }
.cring-info b { color:var(--txt); font-size:13.5px; }
.cring-goal { cursor:pointer; display:flex; flex-direction:column; gap:3px; margin-top:2px; }
.cring-goal span { font-size:12px; color:var(--gold-2); }
.q-prog { display:flex; flex-direction:column; gap:2px; width:100%; }
.q-pct { font-size:10.5px; color:var(--cyan-2); font-weight:700; }
.run-xtra { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:5px; }
.run-anat { font-size:11.5px; color:var(--txt-2); background:var(--s1); border:1px solid var(--line); border-radius:8px; padding:2px 8px; }
.card.rk { border-color:var(--rkc); box-shadow:0 0 0 1px var(--rkc) inset, var(--sh1); }
.queue-row { display:flex; gap:10px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.queue-row::-webkit-scrollbar { display:none; }
.qtile { position:relative; flex:0 0 72px; display:flex; flex-direction:column; gap:3px; text-align:center; }
.qnum { position:absolute; top:-4px; right:-4px; z-index:1; width:20px; height:20px; border-radius:50%; background:var(--cyan); color:#062a33; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px #22d3ee66; }
.qcv { width:72px; height:94px; border-radius:11px; overflow:hidden; background:var(--well); display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; box-shadow:var(--sh1); }
.qcv img { width:100%; height:100%; object-fit:cover; }
.qmove { display:flex; gap:4px; justify-content:center; }
.qmove button { width:28px; height:24px; border-radius:8px; border:1px solid var(--line); background:var(--card-2); color:color-mix(in srgb, #a5f3ff var(--tm), var(--tb)); font-size:10px; cursor:pointer; }
.qmove button:disabled { opacity:.3; }

/* ---------- الجلسات ---------- */
.sess-box { border-color:color-mix(in srgb,var(--gold) 25%,transparent); background:linear-gradient(150deg,color-mix(in srgb,var(--gold) 4%,transparent),var(--card-2)); }
.sess-list { display:flex; flex-direction:column; gap:6px; }
.sess-item { background:var(--card-2); border:1px solid var(--line); border-radius:var(--r1); padding:9px 11px; }
.sess-top { display:flex; align-items:center; gap:8px; font-size:12px; }
.sess-date { font-weight:700; font-variant-numeric:tabular-nums; }
.sess-dur { color:var(--txt-2); flex:1; font-variant-numeric:tabular-nums; }
.sess-edit { background:none; border:none; color:var(--gold-2); font-size:14px; cursor:pointer; padding:2px 4px; }
.sess-note { margin-top:6px; font-size:12.5px; color:color-mix(in srgb, #cdeeff var(--tm), var(--tb)); line-height:1.55; border-top:1px dashed var(--line); padding-top:6px; }
.rar-badge { display:inline-block; margin-right:6px; font-size:10px; font-weight:800; border:1px solid; border-radius:var(--rf); padding:1px 7px; }

/* ---------- البلاتينيوم ---------- */
.card-plat { position:absolute; bottom:9px; left:9px; z-index:2; background:color-mix(in srgb, #06070cd9 var(--bm), var(--bb)); border:1px solid #7de3ff77; border-radius:var(--rf); padding:2px 7px; font-size:12px; backdrop-filter:blur(6px); }
.plat-box { border:1px solid #7de3ff44; background:linear-gradient(150deg,#7de3ff0d,var(--card-2)); border-radius:var(--r3); padding:13px; display:flex; flex-direction:column; gap:8px; }
.plat-box.on { border-color:#7de3ffaa; box-shadow:0 0 24px -6px #7de3ff40; }
.plat-prog { display:flex; gap:14px; font-size:12.5px; font-weight:700; color:var(--txt-2); }
.plat-prog .ok { color:var(--cyan-2); }
.plat-edit { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--txt-2); flex-wrap:wrap; }
.plat-edit input { width:62px; background:var(--card-2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px; font-size:16px; text-align:center; }
.plat-vault { margin-top:14px; border-color:#7de3ff55; }
.plat-b { position:relative; }
.plat-mark { position:absolute; top:4px; left:4px; z-index:2; font-size:14px; filter:drop-shadow(0 0 5px #7de3ff); }

/* ---------- التحديات والمواسم والسلسلة ---------- */
.chall-list { display:flex; flex-direction:column; gap:8px; margin-top:6px; }
.chall-row { display:flex; flex-direction:column; gap:4px; }
.chall-row-t { display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; }
.chall-row-t span { color:var(--txt-2); font-weight:600; }
.chall-row.done .chall-row-t, .chall-row.done .chall-row-t span { color:var(--green); }
.bl-card { background:linear-gradient(150deg,color-mix(in srgb, #251a3d var(--bm), var(--bb)),var(--surf-2)); border:1px solid #a78bfa4d; border-radius:var(--r3); padding:15px; display:flex; flex-direction:column; gap:5px; margin-top:14px; box-shadow:var(--sh2); }
.season-card { border:1px solid color-mix(in srgb,var(--gold) 22%,transparent); background:linear-gradient(160deg,color-mix(in srgb, #1d1729 var(--bm), var(--bb)),var(--surf-2)); display:block; }
.chwk-card { display:block; }
.chwk-card .section-title { margin-bottom:6px; }
.level-card>* { min-width:0; }
.level-card,.chart-card,.track,.ach-run { overflow-wrap:break-word; word-break:break-word; }
.sn-head { display:flex; align-items:center; gap:10px; min-width:0; }
.sn-ic { font-size:34px; filter:drop-shadow(0 4px 12px #0009); }

/* ---------- صفحة اللعبة ---------- */
.gd-rel { position:relative; overflow:hidden; }

/* ---------- شريط الفلاتر ---------- */

.ft-btn { position:relative; flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:linear-gradient(180deg,var(--s1),var(--card-2)); border:1px solid var(--line-2); color:var(--txt); border-radius:var(--r2); padding:12px; font-family:inherit; font-size:13.5px; font-weight:800; cursor:pointer; transition:.16s var(--ease); }

/* ---------- بطاقات الحزمة الداخلية ---------- */
.bundle-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }

.grank-sum { border:1px dashed color-mix(in srgb,var(--gold) 33%,transparent); background:color-mix(in srgb,var(--gold) 5%,transparent); border-radius:var(--r2); padding:11px 13px; font-size:13.5px; }

.grp-dd-btn { position:absolute; left:6px; top:50%; transform:translateY(-50%); background:var(--s3); border:1px solid var(--line-2); color:var(--txt-2); border-radius:8px; width:32px; height:30px; cursor:pointer; font-size:13px; }
.grp-dd { position:absolute; top:calc(100% + 4px); right:0; left:0; z-index:20; background:color-mix(in srgb, #171a2b var(--bm), var(--bb)); border:1px solid var(--line-2); border-radius:var(--r2); overflow:hidden; box-shadow:var(--sh3); max-height:200px; overflow-y:auto; }

.grp-dd-it:last-child { border-bottom:0; }

/* ---------- المؤقّت العائم ---------- */
.timer-float { position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); right:16px; z-index:39; display:flex; align-items:center; gap:9px; background:linear-gradient(150deg,color-mix(in srgb, #201936f2 var(--bm), var(--bb)),color-mix(in srgb, #0f111ff2 var(--bm), var(--bb))); border:1px solid color-mix(in srgb,var(--gold) 53%,transparent); color:var(--gold-2); font-family:'Chakra Petch',sans-serif; font-weight:800; font-size:14px; padding:11px 15px; border-radius:var(--rf); cursor:pointer; box-shadow:0 14px 36px -10px #000, 0 0 24px -8px color-mix(in srgb,var(--gold) 44%,transparent); backdrop-filter:blur(10px); direction:ltr; font-variant-numeric:tabular-nums; }

.timer-float span { direction:rtl; font-family:'IBM Plex Sans Arabic',sans-serif; font-size:11px; color:var(--txt-2); font-weight:700; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.timer-nag { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:12px; right:12px; z-index:70; background:linear-gradient(150deg,color-mix(in srgb, #2e2112 var(--bm), var(--bb)),color-mix(in srgb, #191207 var(--bm), var(--bb))); border:1px solid var(--gold); border-radius:var(--r3); padding:15px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--sh3), 0 0 30px -8px color-mix(in srgb,var(--gold) 31%,transparent); animation:drop .35s var(--ease); }
.tnag-t { font-size:14px; font-weight:800; color:var(--gold-2); line-height:1.7; }

/* ---------- الخريطة الحرارية والمخططات ---------- */
.heat-wrap { background:linear-gradient(180deg,var(--s1),var(--card-2)); border:1px solid var(--line); border-radius:var(--r3); padding:13px; overflow-x:auto; -webkit-overflow-scrolling:touch; box-shadow:var(--sh1); }
.heatmap { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,11px); grid-auto-columns:11px; gap:3px; direction:ltr; width:max-content; }
.heat-c { width:11px; height:11px; border-radius:3px; background:color-mix(in srgb, #161930 var(--bm), var(--bb)); display:inline-block; }

.heat-leg { display:flex; align-items:center; gap:4px; font-size:10.5px; color:var(--txt-2); margin-top:9px; }
.yy-card { background:linear-gradient(180deg,var(--s1),var(--card-2)); border:1px solid var(--line); border-radius:var(--r3); padding:13px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--sh1); }

.yy-head { font-weight:800; border-bottom:1px dashed var(--line); padding-bottom:7px; }
.dist-bars { display:flex; gap:6px; align-items:flex-end; }
.dist-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
.dist-bar { width:100%; height:64px; background:var(--well); border:1px solid var(--line); border-radius:7px; display:flex; align-items:flex-end; overflow:hidden; }
.dist-fill { width:100%; background:linear-gradient(180deg,var(--cyan-2),var(--cyan)); border-radius:5px 5px 0 0; min-height:2px; }

.xp-src { display:flex; flex-direction:column; gap:4px; }
.xp-src-t { display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; }

/* ---------- جدار الملصقات ---------- */
.wall { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.wall-t { position:relative; padding:0; border:1px solid var(--line); border-radius:var(--r1); overflow:hidden; background:var(--card-2); aspect-ratio:3/4; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s var(--ease); }

/* ---------- الملخص السنوي ---------- */
.wrap-card { margin-top:12px; width:100%; max-width:420px; background:linear-gradient(150deg,color-mix(in srgb, #171d40 var(--bm), var(--bb)),var(--surf-2)); border:1px solid #3a4a8a66; border-radius:var(--r3); padding:17px; display:flex; flex-direction:column; gap:10px; text-align:right; box-shadow:var(--sh2); }

.wrap-chip b { font-size:18px; color:var(--violet); font-variant-numeric:tabular-nums; }

.ach-run { display:flex; gap:12px; background:linear-gradient(150deg,color-mix(in srgb,var(--gold) 8%,transparent),var(--card-2)); border:1px solid color-mix(in srgb,var(--gold) 25%,transparent); border-radius:var(--r3); padding:13px 15px; backdrop-filter:blur(4px); transition:transform .2s var(--ease), box-shadow .2s var(--ease); }

.runs-list .ach-run { animation:riseIn .5s var(--ease) both; cursor:pointer; }

.runs-list.timeline { position:relative; padding-inline-start:22px; }

/* ---------- أقسام النموذج ---------- */

/* ---------- علاج عام لخروج النص ---------- */

.gcard-top { display:flex; justify-content:space-between; align-items:center; }

.toast { pointer-events:auto; width:100%; max-width:360px; background:linear-gradient(150deg,color-mix(in srgb, #281e46 var(--bm), var(--bb)),color-mix(in srgb, #13122a var(--bm), var(--bb))); border:1px solid var(--violet-2); border-radius:var(--r3); padding:15px; box-shadow:0 22px 55px -14px #6d4cff70, var(--sh3); animation:drop .4s cubic-bezier(.2,.9,.3,1.4); backdrop-filter:blur(10px); }

.chart-card { background:linear-gradient(180deg,var(--s1),var(--card-2)); border:1px solid var(--line); border-radius:var(--r4); padding:16px 14px 12px; box-shadow:var(--sh1); }

.gbar-name { width:96px; flex-shrink:0; font-size:12px; font-weight:700; color:var(--txt-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; unicode-bidi:plaintext; }

/* ---------- الشهادة ---------- */
