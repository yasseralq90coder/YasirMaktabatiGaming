/* ---------- الاستجابة ---------- */
@media (max-width:560px) {
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .stat-grid { grid-template-columns:repeat(3,1fr); }
  .ach-sum { grid-template-columns:repeat(3,1fr); }
  .kpi-grid { grid-template-columns:repeat(2,1fr); }
  .dash-cols { grid-template-columns:1fr; }
  .cbar-track { height:96px; }
  .gbar-name { width:78px; }
  .cert-iframe { height:560px; }
  .shelf-row { grid-auto-columns:142px; }
}
@media (max-width:520px) {
  .detail-actions .btn, .timer-btns .btn { flex:1; }
  .cert-iframe { height:70dvh; }
  .fab { bottom:calc(16px + env(safe-area-inset-bottom)); }
  .modal-body { padding:14px; }
  .level-card { padding:16px; gap:14px; }
  .rank-emoji { font-size:44px; }
}
/* ════════════════════════════════════════════
   إعادة التصميم الجذرية — البطل / الحبوب / الشريط السفلي
   ════════════════════════════════════════════ */
:root{ --nav-h:64px; --ember:#ff7a3c; }
.app{ padding:0 0 calc(var(--nav-h) + 40px); }
.app > *:not(.hero):not(.tabs):not(.modal-backdrop):not(.fab):not(.timer-float){ padding-inline:16px; }
.app > .sec, .app > .posters{ padding-inline:0; }

/* ---------- البطل ---------- */
.topbar{ display:none; }
.hero{ position:relative; min-height:72vh; display:flex; flex-direction:column; justify-content:flex-end;
  padding:20px 18px 22px; margin:0 0 4px; overflow:hidden; isolation:isolate; }
.hero-art{ position:absolute; inset:0; z-index:-2; background-size:cover; background-position:center 22%;
  filter:saturate(1.25) brightness(.8); transform:scale(1.08); }
.hero-fade{ position:absolute; inset:0; z-index:-1;
  background:linear-gradient(180deg,color-mix(in srgb, #06070ccc var(--bm), var(--bb)) 0%,#06070c26 28%,color-mix(in srgb, #06070ce6 var(--bm), var(--bb)) 70%,var(--bg) 100%); }
.hero-eyebrow{ position:absolute; top:calc(16px + env(safe-area-inset-top)); right:18px; display:flex;
  align-items:center; gap:7px; font-size:11px; font-weight:800; color:var(--gold-2); letter-spacing:1.4px; }
.pulse{ width:7px; height:7px; border-radius:50%; background:var(--ember); box-shadow:0 0 0 0 #ff7a3caa; animation:hpulse 2s infinite; }
@keyframes hpulse{ 70%{box-shadow:0 0 0 9px #ff7a3c00} 100%{box-shadow:0 0 0 0 #ff7a3c00} }
.hero-body{ display:flex; gap:16px; align-items:flex-end; }
.hero-cover{ width:112px; aspect-ratio:3/4; border-radius:14px; flex:none; overflow:hidden; cursor:pointer;
  background:linear-gradient(150deg,color-mix(in srgb, #2a2f45 var(--bm), var(--bb)),var(--card-2)); border:1px solid #ffffff20; display:grid; place-items:center;
  font-size:32px; box-shadow:0 24px 50px -12px #000, 0 0 0 1px #0008; transform:rotate(-2deg); transition:.25s var(--ease); }
.hero-cover:active{ transform:rotate(0) scale(.96); }
.hero-cover img{ width:100%; height:100%; object-fit:cover; }
.hero-meta{ flex:1; min-width:0; padding-bottom:2px; }
.hero-plat{ font-size:11px; font-weight:800; color:var(--txt-2); letter-spacing:.6px; }
.hero-name{ font-size:27px; font-weight:900; line-height:1.14; letter-spacing:-.8px; margin:5px 0 9px;
  text-shadow:0 3px 20px #000a; cursor:pointer; unicode-bidi:plaintext; }
.hero-time{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
.hero-time b{ font-family:'Chakra Petch',sans-serif; font-size:25px; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; }
.hero-time span{ font-size:12px; color:var(--txt-2); font-weight:700; }
.hero.live .hero-time b{ animation:tpulse 2s ease-in-out infinite; }
.hero-cta{ display:flex; gap:9px; margin-top:18px; }
.play{ flex:1; display:flex; align-items:center; justify-content:center; gap:9px;
  background:linear-gradient(140deg,var(--gold-2),var(--gold) 55%,var(--ember)); color:var(--gold-ink);
  border:0; border-radius:16px; padding:16px; font-family:inherit; font-size:16px; font-weight:900;
  cursor:pointer; box-shadow:0 12px 32px -8px color-mix(in srgb,var(--gold) 50%,transparent); transition:transform .15s; }
.play:active{ transform:scale(.97); }
.icon-sq{ width:54px; border-radius:16px; border:1px solid var(--line-2); background:color-mix(in srgb, #0c0e18b3 var(--bm), var(--bb));
  backdrop-filter:blur(12px); color:var(--txt); font-size:19px; cursor:pointer; }

/* ---------- شريط الحبوب ---------- */
.pulse-bar{ display:flex; align-items:center; gap:8px; padding:14px 16px 4px; overflow-x:auto; scrollbar-width:none; }
.pulse-bar::-webkit-scrollbar{ display:none; }
.pill{ flex:none; display:flex; align-items:center; gap:7px; padding:9px 13px; border-radius:var(--rf);
  background:#ffffff09; border:1px solid var(--line); font-size:12.5px; font-weight:700; color:var(--txt-2); white-space:nowrap; }
.pill b{ color:var(--txt); font-size:14px; font-family:'Chakra Petch',sans-serif; font-variant-numeric:tabular-nums; }
.pill.hot{ border-color:#ff7a3c55; background:#ff7a3c12; }
.pill.hot b{ color:var(--ember); }
.pill.goal{ cursor:pointer; }
.pill.goal.met{ border-color:#4ade8055; background:#4ade8012; }
.lvlbar{ width:44px; height:5px; border-radius:9px; background:#ffffff14; overflow:hidden; flex:none; }
.lvlbar i{ display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-2)); }

/* ---------- الأقسام والسكك ---------- */
.sec{ margin-top:14px; }
.sec-h{ display:flex; align-items:baseline; justify-content:space-between; padding:0 16px 11px; gap:10px; }
.sec-t{ font-size:17px; font-weight:800; letter-spacing:-.4px; }
.sec-n{ font-size:12px; color:var(--txt-4); font-weight:700; }
.arcade-rank-badge{ padding:3px 10px; border-radius:999px; background:linear-gradient(90deg,rgba(255,95,162,.16),rgba(124,92,255,.16) 45%,rgba(34,211,238,.16)); border:1px solid rgba(124,92,255,.35); color:#e3d9ff !important; }
/* ---- إنجازات RetroAchievements ---- */
.ra-box{ border-color:rgba(255,193,68,.28); }
/* ===== إنجازات RetroAchievements: التكرار والربط اليدوي =====
   ملاحظة: هذه كلها حاويات عمودية أو صفوف مستقلة — لا تستخدم .track لأي منها،
   فهي flex صف وتسحق الأعمدة حتى يظهر النص حرفًا في كل سطر (خطأ ٥ في AGENTS.md). */
/* ===== تبويب المِران: الرتب الثلاث والألقاب والمِحكّات =====
   ⚠️ كلها حاويات عمودية — لا .track هنا (خطأ ٥: flex صف يسحق الأعمدة). */
.mrank-wrap{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; margin-top:12px; }
.mrank{
  display:grid; grid-template-columns:auto 1fr; gap:4px 11px; align-items:center;
  padding:14px 15px; border-radius:var(--r2); border:1px solid var(--line);
  background:var(--s1);
}
.mrank.main{ border-color:rgba(245,185,66,.4); background:rgba(245,185,66,.07); }
.mrank.shelf{ border-color:rgba(34,211,238,.3); background:rgba(34,211,238,.06); }
.mrank .mr-ic{ font-size:26px; line-height:1; grid-row:span 2; }
.mrank .mr-i{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.mrank .mr-i b{ font-size:14px; line-height:1.4; }
.mrank .mr-i small{ font-size:10.5px; color:var(--txt-4); font-family:var(--num); }
.mrank.main .mr-i b{ color:#f5b942; }
.mr-bar{ grid-column:1 / -1; height:5px; border-radius:999px; background:var(--well); overflow:hidden; margin-top:6px; }
.mr-fill{ height:100%; background:linear-gradient(90deg,#f5b942,#ffd479); transition:width .5s var(--ease); }
.mrank.shelf .mr-fill{ background:linear-gradient(90deg,#22d3ee,#7de3ff); }
.mr-next{ grid-column:1 / -1; font-size:10px; color:var(--txt-4); margin-top:3px; }

/* الألقاب */
.title-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; }
.ttl-card{
  display:flex; align-items:flex-start; gap:10px; padding:12px 13px;
  border-radius:var(--r2); border:1px solid var(--line); background:var(--s1); opacity:.55;
}
.ttl-card.on{ opacity:1; border-color:rgba(167,139,250,.45); background:rgba(167,139,250,.08); }
.ttl-card.feat.on{ border-color:rgba(74,222,128,.4); background:rgba(74,222,128,.07); }
.ttl-card.feat.on .tc-i b{ color:#4ade80; }
.ttl-card .tc-ic{ font-size:21px; line-height:1; flex:none; filter:grayscale(1); }
.ttl-card.on .tc-ic{ filter:none; }
.ttl-card .tc-i{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.ttl-card .tc-i b{ font-size:13px; }
.ttl-card .tc-i small{ font-size:10.5px; color:var(--txt-4); line-height:1.5; }
.ttl-card.on .tc-i b{ color:#a78bfa; }
.ttl-card .tc-ok{ flex:none; color:#4ade80; font-weight:800; font-size:14px; }

/* المِحكّات */
.trial-grp{ display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
.trial{ display:flex; flex-direction:column; gap:2px; padding:10px 12px;
  border-radius:var(--r2); border:1px solid var(--line); background:var(--s1); }
.trial .tr-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.trial .tr-l{ font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.trial .tr-top b{ font-family:var(--num); font-size:12px; color:#f5b942; flex:none; }
.trial .tr-n{ font-size:10px; color:var(--txt-4); }

/* رتبة الرفّ — قائمة عمودية. ⚠️ اسمها كان shelf-row وهو اسم مأخوذ أصلًا لرفوف
   المكتبة (شبكة أفقية بأعمدة 158px وتمرير). القاعدة الأدنى كانت تفوز فتحوّل
   الرفّ إلى flex، فتتقاسم ثماني بطاقات عرض الشاشة وينهار النص إلى حرف في كل
   سطر — خطأ ٥ بعينه. افحص أن الاسم غير مستعمل قبل أن تصف به شيئًا.
   ⚠️⚠️ ولا تكتب علامة اقتباس مائلة في تعليقات CSS: كل هذا داخل قالب JS */
.shelf-list{ display:flex; flex-direction:column; gap:6px; }
.shelf-item{
  display:flex; align-items:center; gap:11px; width:100%; text-align:start;
  padding:11px 13px; border-radius:var(--r2); border:1px solid var(--line);
  background:var(--s1); color:var(--txt-1); cursor:pointer; font-family:inherit;
  transition:border-color .15s var(--ease), background .15s var(--ease);
}
.shelf-item:hover{ border-color:rgba(34,211,238,.4); background:rgba(34,211,238,.06); }
.shelf-item .sr-i{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.shelf-item .sr-i b{ font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.shelf-item .sr-i small{ font-size:10.5px; color:var(--txt-4); }
.shelf-item .sr-h{ flex:none; font-family:var(--num); font-size:12.5px; font-weight:800; color:#22d3ee; }
/* ===== نظام المِران: وسام اللعبة ووسم السَّحب =====
   ⚠️ لا تستخدم .track لأي حاوية هنا — هي flex صف وتسحق الأعمدة (خطأ ٥). */
.card-medal{
  position:absolute; top:6px; inset-inline-start:6px; z-index:3;
  display:inline-flex; align-items:center; gap:1px;
  font-size:12px; font-weight:800; font-family:var(--num);
  padding:2px 6px; border-radius:8px; line-height:1.4;
  background:rgba(10,12,20,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14); color:#fff;
}
.card-medal.gild{
  background:rgba(245,185,66,.92); color:#231a05;
  border-color:rgba(255,255,255,.4);
  box-shadow:0 0 10px rgba(245,185,66,.5);
}
/* وسم السَّحب — نبرة ساخرة من الذات لا تأنيب، فالألوان هادئة لا حمراء صارخة */
.card-ghost{
  margin-top:3px; font-size:10.5px; font-weight:700; line-height:1.5;
  color:var(--txt-4); display:flex; align-items:center; gap:3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.card-ghost.back{ color:#4ade80; }
/* صفّ الوسام في صفحة اللعبة */
.medal-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.medal-big{
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 14px; border-radius:var(--r2);
  border:1px solid var(--hair); background:var(--e1);
}
.medal-big.gild{ border-color:rgba(245,185,66,.45); background:rgba(245,185,66,.1); }
.medal-big .mb-ic{ font-size:22px; line-height:1; }
.medal-big .mb-i{ display:flex; flex-direction:column; gap:1px; }
.medal-big .mb-i b{ font-size:13.5px; }
.medal-big .mb-i small{ font-size:10.5px; color:var(--txt-4); }
.medal-big.gild .mb-i b{ color:#f5b942; }
.cycle-chip{
  font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
  background:rgba(167,139,250,.12); color:#a78bfa; border:1px solid rgba(167,139,250,.3);
}
.ghost-big{
  display:flex; align-items:center; gap:9px; padding:10px 13px;
  border-radius:var(--r2); border:1px solid var(--hair); background:var(--e1);
  font-size:12.5px; color:var(--txt-2);
}
.ghost-big.back{ border-color:rgba(74,222,128,.35); background:rgba(74,222,128,.08); }
.ghost-big .gb-ic{ font-size:19px; line-height:1; flex:none; }
.ghost-big b{ font-size:13.5px; color:var(--txt-1); }
/* سطر إجمالي مصادر الخبرة — يجب أن يطابق الإجمالي المعروض تحت المستوى */
.sw-nag{ border-color:rgba(74,222,128,.45); }
.sw-nag .tnag-t:first-child{ color:#4ade80; }
.xp-total{ margin-top:10px; padding-top:8px; border-top:1px solid var(--hair); font-size:12px; color:var(--txt-2); text-align:center; }
.xp-total b{ font-family:var(--num); color:#f5b942; font-size:14px; }
.xp-drift{ color:#fb7185; font-size:10.5px; }
/* أسماء ألعاب المحاكي التي لم تُطابَق تلقائيًا — تحتاج ربطًا يدويًا */
.ra-miss{ display:flex; flex-direction:column; gap:3px; margin-top:5px; }
.ra-miss-i{ font-size:10.5px; color:var(--txt-3); padding:3px 7px; border-radius:6px; background:var(--well); direction:ltr; text-align:start; }
.ra-repeat-row{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 2px; }
.ra-chip{ font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; border:1px solid var(--hair); background:var(--e1); color:var(--txt-2); }
.ra-chip.mast{ border-color:rgba(244,114,182,.4); background:rgba(244,114,182,.1); color:#f472b6; }
.ra-chip.rep{ border-color:rgba(251,146,60,.4); background:rgba(251,146,60,.1); color:#fb923c; }
.ra-chip.pts{ border-color:rgba(167,139,250,.4); background:rgba(167,139,250,.1); color:#a78bfa; }
.ra-times{ display:inline-block; margin-inline-start:6px; font-family:var(--num); font-size:10px; font-weight:800; padding:1px 6px; border-radius:999px; background:rgba(251,146,60,.16); color:#fb923c; border:1px solid rgba(251,146,60,.35); }
.ra-link-row{ display:flex; gap:6px; margin-top:6px; }
.ra-link-row .btn{ flex:1; font-size:11px; }
/* قائمة اختيار لعبة RA داخل نافذة الربط */
.ra-pick-list{ display:flex; flex-direction:column; gap:6px; margin-top:10px; max-height:46vh; overflow-y:auto; }
.ra-pick-row{ display:flex; align-items:center; gap:9px; width:100%; text-align:start; padding:9px 10px; border-radius:var(--r2); border:1px solid var(--hair); background:var(--e1); color:var(--txt-1); cursor:pointer; transition:border-color .15s var(--ease), background .15s var(--ease); }
.ra-pick-row:hover:not(:disabled){ border-color:rgba(245,185,66,.45); background:rgba(245,185,66,.07); }
.ra-pick-row:disabled{ opacity:.5; cursor:default; }
.ra-pick-i{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.ra-pick-i b{ font-size:12.5px; direction:ltr; text-align:start; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ra-pick-i small{ font-size:10px; color:var(--txt-4); }
.ra-pick-go{ flex:none; font-size:10.5px; font-weight:700; color:#f5b942; }
.ra-prog{ position:relative; height:16px; border-radius:999px; background:var(--well); overflow:hidden; margin:8px 0 4px; border:1px solid var(--hair); }
.ra-prog-fill{ height:100%; background:linear-gradient(90deg,#f5b942,#ffd479); transition:width .5s var(--ease); }
.ra-prog-t{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; font-family:var(--num); color:#0b0d17; text-shadow:0 0 3px rgba(255,255,255,.5); }
.ra-hc{ font-size:10.5px; color:#fb7185; font-weight:700; margin-bottom:6px; }
.ra-tabs{ display:flex; gap:6px; margin:8px 0; }
.ra-tab{ flex:1; padding:7px 8px; border-radius:var(--r2); border:1px solid var(--hair); background:var(--e1); color:var(--txt-3); font-family:inherit; font-size:11px; font-weight:700; cursor:pointer; transition:.16s var(--sp); }
.ra-tab.on{ background:rgba(245,185,66,.14); border-color:rgba(245,185,66,.5); color:#f5b942; }
.ra-list{ display:flex; flex-direction:column; gap:6px; max-height:420px; overflow-y:auto; }
.ra-item{ display:flex; align-items:center; gap:9px; padding:8px; border-radius:var(--r2); border:1px solid var(--hair); background:var(--e1); }
.ra-item.got{ border-color:rgba(74,222,128,.3); background:rgba(74,222,128,.05); }
.ra-badge{ width:38px; height:38px; border-radius:9px; flex:none; object-fit:cover; }
.ra-item:not(.got) .ra-badge{ filter:grayscale(1) brightness(.6); }
.ra-badge-ph{ display:flex; align-items:center; justify-content:center; background:var(--well); font-size:17px; }
.ra-i{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.ra-i b{ font-size:12px; font-weight:800; }
.ra-i small{ font-size:10.5px; color:var(--txt-3); line-height:1.35; }
.ra-date{ color:#4ade80 !important; font-weight:700; }
.ra-guide{ font-size:10.5px; color:#a78bfa; text-decoration:none; font-weight:700; align-self:flex-start; }
.ra-pts{ flex:none; font-family:var(--num); font-size:12px; font-weight:800; color:#f5b942; }
.ra-sync{ font-size:10px; color:var(--txt-4); text-align:center; margin-top:6px; }
/* ---- تبويب إنجازات RA في الإحصائيات ---- */
.ragame{ display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:var(--r3); border:1px solid var(--line); background:linear-gradient(180deg,var(--s1),var(--card-2)); box-shadow:var(--sh1); }
.rag-filters{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.rag-head{ display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:var(--r2); border:1px solid var(--hair); background:var(--e1); cursor:pointer; }
.rag-head img{ width:34px; height:34px; border-radius:8px; flex:none; object-fit:cover; }
.rag-head .rag-t{ flex:1; min-width:0; }
.rag-head b{ display:block; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rag-head small{ font-size:10.5px; color:var(--txt-3); }
.rag-n{ flex:none; font-family:var(--num); font-size:11.5px; font-weight:800; color:#f5b942; }
.rag-grid{ display:flex; flex-wrap:wrap; gap:6px; padding:8px 4px 2px; }
.rag-grid img{ width:44px; height:44px; border-radius:9px; object-fit:cover; }
.rag-empty{ text-align:center; color:var(--txt-4); font-size:12px; padding:22px 12px; }
.rail{ display:flex; gap:11px; overflow-x:auto; padding:2px 16px 6px; scroll-snap-type:x mandatory; scrollbar-width:none; }
.rail::-webkit-scrollbar{ display:none; }
.rail > *{ scroll-snap-align:start; flex:none; width:104px; }
.rail .rtile-cv{ height:auto; aspect-ratio:3/4; border-radius:12px; }

/* ---------- رأس المكتبة اللاصق ---------- */
.lib-h{ display:flex; align-items:center; gap:9px; padding:22px 16px 12px; position:sticky; top:0; z-index:6;
  background:linear-gradient(var(--bg) 55%,color-mix(in srgb, #07080edd var(--bm), var(--bb)) 80%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
.lib-t{ font-size:17px; font-weight:800; letter-spacing:-.4px; flex:1; }
.ctl{ width:38px; height:38px; flex:none; border-radius:12px; border:1px solid var(--line); background:#ffffff08;
  color:var(--txt-2); font-size:15px; cursor:pointer; display:grid; place-items:center; transition:.14s; }
.ctl:active{ transform:scale(.92); }
.lib-h .search{ flex:1; padding:9px 13px; font-size:16px; border-radius:12px; }
.search-row{ display:none; }

/* ---------- الشريط السفلي العائم ---------- */
.tabs{ position:fixed; bottom:calc(14px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  z-index:45; display:flex; gap:2px; padding:6px; border-radius:var(--rf); margin:0;
  background:color-mix(in srgb, #0e1120d9 var(--bm), var(--bb)); border:1px solid #ffffff1a; backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6); box-shadow:0 18px 46px -10px #000, 0 0 0 1px #0006;
  width:calc(100% - 32px); max-width:420px; }
.tabs button{ flex:1; border:0; background:none; color:var(--txt-4); font-family:inherit; font-size:9.5px;
  font-weight:800; padding:8px 2px 7px; border-radius:var(--rf); cursor:pointer; display:flex;
  flex-direction:column; align-items:center; gap:3px; transition:.2s var(--ease); }
.tabs button i{ font-style:normal; font-size:17px; line-height:1; filter:grayscale(1) opacity(.55); transition:.2s; }
.tabs button em{ font-style:normal; }
.tabs button.on{ background:#ffffff0e; color:var(--gold); box-shadow:none; border:0; }
.tabs button.on i{ filter:none; }
.fab{ bottom:calc(88px + env(safe-area-inset-bottom)); left:16px; width:52px; height:52px; font-size:27px; }
.timer-float{ bottom:calc(88px + env(safe-area-inset-bottom)); }

/* ---------- الشبكة حافة لحافة ---------- */
.grid{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; padding:0 16px; }
.card{ border-radius:12px; }
.card-name{ font-size:12px; min-height:32px; }
.card-body{ padding:8px 9px 10px; gap:5px; }
.card-foot{ font-size:10px; }
.wall{ padding:0 16px; }
@media (min-width:560px){ .grid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); } }
@media (max-width:560px){ .grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width:380px){ .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } .hero{ min-height:66vh; } .hero-name{ font-size:23px; } }

/* ════════════════════════════════════════════
   إعادة تصميم التبويبات الأربعة الباقية
   ════════════════════════════════════════════ */

/* ---------- انتقال سلس بين التبويبات ---------- */
::view-transition-old(root){ animation:vtOut .16s ease both; }
::view-transition-new(root){ animation:vtIn .28s var(--ease) both; }
@keyframes vtOut{ to{ opacity:0; transform:translateY(-6px) } }
@keyframes vtIn{ from{ opacity:0; transform:translateY(10px) } }

/* ---------- إصلاح: الخريطة الحرارية في الإحصائيات كانت غير مرئية ---------- */
.hm{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,10px); grid-auto-columns:10px;
  gap:3px; direction:ltr; width:max-content; }
.hm-c{ width:10px; height:10px; border-radius:2.5px; background:color-mix(in srgb, #161930 var(--bm), var(--bb)); }
.hm-c.l0{ background:color-mix(in srgb, #141728 var(--bm), var(--bb)); }
.hm-c.l1{ background:color-mix(in srgb, #3f3111 var(--bm), var(--bb)); }
.hm-c.l2{ background:#806018; }
.hm-c.l3{ background:#cb9a24; }
.hm-c.l4{ background:var(--gold); box-shadow:0 0 6px color-mix(in srgb,var(--gold) 44%,transparent); }
.hm-h{ font-size:14px; font-weight:800; margin-bottom:12px; letter-spacing:-.3px; }
.hm-leg{ display:flex; align-items:center; gap:4px; font-size:10.5px; color:var(--txt-3); margin-top:10px; }
.chart-card:has(.hm){ overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.chart-card:has(.hm)::-webkit-scrollbar{ display:none; }

/* ---------- لغة التصميم الموحّدة: عناوين أقسام بدل الصناديق ---------- */
.stats, .dash, .backup, .nso-view{ gap:22px; }

/* الرؤوس: خط رفيع + عنوان، لا صندوق */
.bk-title, .dash-card-h, .hm-h{
  font-size:15px; font-weight:800; letter-spacing:-.3px; padding-bottom:10px;
  border-bottom:1px solid var(--line); margin-bottom:14px; }

/* الصناديق تفقد حدودها وتصير أقساماً */
.bk-card, .dash-card, .chart-card, .heat-wrap, .yy-card{
  background:none; border:0; border-radius:0; padding:0; box-shadow:none; }

/* النصوص الوصفية الطويلة تنكمش */
.bk-desc, .nso-info + *, .info-desc{ font-size:12.5px; line-height:1.65; color:var(--txt-3); }
.bk-desc{ margin-bottom:12px; }

/* ---------- الإعدادات: صفوف نظيفة ---------- */
.backup{ padding-top:8px; }
.bk-card + .bk-card{ margin-top:4px; }
/* شريط كشف المقفل — سطر واحد بدل صفوف رمادية بحجمها الكامل */
.lockbar{ display:block; width:100%; margin-top:8px; padding:9px 12px; border:1px dashed var(--hair); border-radius:var(--r2); background:transparent; color:var(--txt-4); font-size:12px; font-weight:700; cursor:pointer; transition:color .15s var(--ease), border-color .15s var(--ease); }
.lockbar:hover{ color:var(--txt-2); border-color:var(--txt-4); }
/* ===== دمج نسختَي لعبة واحدة (الإعدادات) =====
   حاويات عمودية — لا تستخدم .track هنا (خطأ ٥: هي flex صف وتسحق الأعمدة). */
.mrg-set{ margin-top:10px; padding:10px 12px; border:1px solid var(--hair); border-radius:var(--r2); background:var(--e1); }
.mrg-name{ font-size:13px; font-weight:800; color:var(--txt-1); margin-bottom:6px; }
.mrg-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:6px 0; border-top:1px solid var(--hair); }
.mrg-row:first-of-type{ border-top:0; }
.mrg-i{ flex:1; min-width:150px; display:flex; flex-direction:column; gap:2px; }
.mrg-i b{ font-size:12px; color:var(--txt-1); }
.mrg-i small{ font-size:10.5px; color:var(--txt-4); }
.mrg-row .btn{ flex:none; padding:5px 12px; font-size:11.5px; }
.bk-actions .btn, .bk-paste .btn{ flex:1; min-width:0; }
.bk-text{ font-size:10px; min-height:70px; }
.bk-steps{ font-size:12px; }

/* ---------- NSO: شرائح في سكة أفقية بدل 3 صفوف ملتفّة ---------- */
.nso-view > .filters, .period-bar{
  display:flex; flex-wrap:nowrap; overflow-x:auto; gap:7px; padding:2px 0 8px;
  background:none; border:0; border-radius:0; scrollbar-width:none; }
.nso-view > .filters::-webkit-scrollbar, .period-bar::-webkit-scrollbar{ display:none; }
.nso-view > .filters .chip, .period-bar .chip, .period-bar .ychip{ flex:none; }
.period-lbl, .sort-label{ flex:none; white-space:nowrap; }
.nso-row{ padding:10px 12px; gap:8px; }
.nso-row .btn{ font-size:12px; padding:8px 12px; min-height:36px; }
.nso-name{ font-size:13px; }
.nso-meta{ font-size:11px; }

/* ---------- الإحصائيات: توحيد ألوان الأرقام ---------- */
.kpi-grid{ grid-template-columns:repeat(3,1fr); gap:8px; }
.kpi{ padding:14px 4px; border-radius:var(--r2); }
.kpi-val{ font-size:20px; color:var(--txt) !important; }
.kpi-ic{ font-size:18px; opacity:.85; }
.kpi-lbl{ font-size:10px; }
.stat-grid{ gap:8px; }
.stat{ border-radius:var(--r2); padding:14px 6px; }
.stat-n{ font-size:21px; }
.ach-sum{ grid-template-columns:repeat(5,1fr); gap:7px; }
.ach-sum-cell{ padding:12px 4px; border-radius:var(--r2); }

/* ---------- بطاقة المستوى: أنحف ---------- */
.level-card{ padding:16px; gap:14px; border-radius:var(--r3); }
.rank-emoji{ font-size:40px; }
.rank-name{ font-size:18px; }
.level-num{ font-size:12px; margin:2px 0 9px; }
.xp-text{ font-size:11px; }

@media (max-width:560px){
  .kpi-grid{ grid-template-columns:repeat(3,1fr); }
  .ach-sum{ grid-template-columns:repeat(5,1fr); }
  .kpi-val{ font-size:17px; }
  .ach-sum-cell b{ font-size:15px; }
  .ach-sum-cell span:last-child{ font-size:9px; }
}

@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}


/* ════════════════════════════════════════════════════════════
   الطبقة الجذرية v2 — "الجوهرة"
   نظام واحد: طباعة • سطوح • حركة • لون حي • انتقال مشترك
   ════════════════════════════════════════════════════════════ */

/* ---------- 1. الطباعة: 700 هو السقف، الهرمية بالحجم والتتبّع ---------- */
:root{
  --f: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --num: 'Chakra Petch', ui-monospace, monospace;
  --g: var(--gold);            /* لون اللعبة الحيّ — يُحقن من الغلاف */
  --g-soft: color-mix(in srgb,var(--gold) 13%,transparent);
  --sp: cubic-bezier(.2,.9,.25,1);      /* نابض */
  --sp2: cubic-bezier(.34,1.4,.5,1);    /* ارتداد */
}
.app{ letter-spacing:-.2px; -webkit-tap-highlight-color:transparent;
  font-synthesis-weight:none; text-rendering:optimizeLegibility; }
.hero-name{ font-size:30px; letter-spacing:-1.1px; line-height:1.1; }
.sec-t,.lib-t,.modal-head h2{ letter-spacing:-.5px; }
::selection{ background:var(--g); color:#0b0b12; }
.app ::-webkit-scrollbar{ width:0; height:0; }

/* ---------- 2. السطوح: زجاج حقيقي + سلّم ارتفاع واحد ---------- */
:root{
  --e0:#0b0d17cc;
  --e1:linear-gradient(180deg,#ffffff0d,#ffffff05);
  --hair:#ffffff14;
  --hair-2:#ffffff26;
}
.kpi,.stat,.dash-card,.chart-card,.bk-card,.level-card,.ach-sum-cell,
.runs-box,.cover-row,.gcard,.nso-row,.ach-run,.grp-sib{ border-color:var(--hair); }
.card:not(.rk){ border-color:var(--hair); }
.card{ background:var(--e1); }
.card.rk{ box-shadow:0 0 0 1px var(--rkc) inset, 0 10px 26px -14px #000; }

/* ---------- 3. اللمس: كل شيء ينضغط ---------- */
button,.card,.chip,.pill,.ctl,.atab,.dtab,.grp-sib,.ychip,.nso-row,.gcard{
  transition:transform .18s var(--sp), border-color .18s, background .18s, color .18s, box-shadow .22s var(--sp);
  will-change:transform;
}
button:active,.card:active,.gcard:active,.grp-sib:active{ transform:scale(.965); }
.chip:active,.pill:active,.atab:active,.dtab:active,.ychip:active{ transform:scale(.93); }
.card:hover{ transform:translateY(-4px); box-shadow:0 22px 44px -18px #000, 0 0 0 1px var(--hair-2); }

/* ---------- 4. اللون الحيّ: تلوين حسب غلاف اللعبة ---------- */
.gd-rel{ --g:var(--gold); --g-soft:color-mix(in srgb, var(--g) 13%, transparent); }
.gd-rel .gd-bg{ filter:saturate(1.6) brightness(.55) blur(34px); opacity:.5; transform:scale(1.25); }
.gd-rel::before{
  content:''; position:absolute; inset:0 0 auto; height:280px; pointer-events:none; z-index:0;
  background:radial-gradient(120% 100% at 50% 0%, var(--g) 0%, transparent 62%); opacity:.18;
}
.gd-rel .chip.on,.gd-rel .dtab.on,.gd-rel .seg button.on{
  background:var(--g) !important; color:#0b0b12 !important; border-color:transparent !important;
  box-shadow:0 8px 22px -8px var(--g);
}
.gd-rel .runs-head b,.gd-rel .gd-chip b,.gd-rel .stat-n{ color:var(--g); }
.gd-rel .icon-btn:active{ border-color:var(--g); }
.gd-rel .cover-prev{ box-shadow:0 26px 60px -18px #000, 0 0 34px -12px var(--g); border-color:#ffffff2e; }
.app.ambient{
  background:radial-gradient(1100px 600px at 78% -10%, color-mix(in srgb, var(--g) 26%, transparent) 0%, transparent 58%),
    radial-gradient(880px 520px at -12% 8%, color-mix(in srgb, var(--g) 14%, color-mix(in srgb, #0a2b3d var(--bm), var(--bb))) 0%, transparent 52%),
    radial-gradient(620px 420px at 50% 100%, color-mix(in srgb, var(--g) 12%, color-mix(in srgb, #1a1206 var(--bm), var(--bb))) 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
  transition:background-color 1s ease;
}

/* ---------- 5. الانتقال المشترك: الغلاف يتمدّد لصفحة اللعبة ---------- */
::view-transition-group(gcover){ animation-duration:.44s; animation-timing-function:var(--sp); }
::view-transition-old(gcover),::view-transition-new(gcover){
  animation-duration:.44s; height:100%; object-fit:cover; mix-blend-mode:normal;
}
::view-transition-old(gcover){ animation-name:fadeOutQ; }
::view-transition-new(gcover){ animation-name:fadeInQ; }
@keyframes fadeOutQ{ to{ opacity:0 } }
@keyframes fadeInQ{ from{ opacity:0 } }
.vt-src{ view-transition-name:gcover; }
.gd-rel .cover-prev{ view-transition-name:gcover; }

/* ---------- 6. الدخول المتدرّج للبطاقات ---------- */
@keyframes tileIn{ from{ opacity:0; transform:translateY(14px) scale(.94) } to{ opacity:1; transform:none } }
.grid > *, .wall > *, .rail > *{ animation:tileIn .42s var(--sp) both; }
.grid > *:nth-child(1),.wall > *:nth-child(1),.rail > *:nth-child(1){ animation-delay:.01s }
.grid > *:nth-child(2),.wall > *:nth-child(2),.rail > *:nth-child(2){ animation-delay:.04s }
.grid > *:nth-child(3),.wall > *:nth-child(3),.rail > *:nth-child(3){ animation-delay:.07s }
.grid > *:nth-child(4),.wall > *:nth-child(4),.rail > *:nth-child(4){ animation-delay:.10s }
.grid > *:nth-child(5),.wall > *:nth-child(5),.rail > *:nth-child(5){ animation-delay:.13s }
.grid > *:nth-child(6),.wall > *:nth-child(6),.rail > *:nth-child(6){ animation-delay:.16s }
.grid > *:nth-child(7),.wall > *:nth-child(7),.rail > *:nth-child(7){ animation-delay:.19s }
.grid > *:nth-child(8),.wall > *:nth-child(8),.rail > *:nth-child(8){ animation-delay:.22s }
.grid > *:nth-child(n+9),.wall > *:nth-child(n+9),.rail > *:nth-child(n+9){ animation-delay:.25s }
.sec{ animation:tileIn .5s var(--sp) both; }
.sec:nth-of-type(2){ animation-delay:.06s } .sec:nth-of-type(3){ animation-delay:.12s }
.sec:nth-of-type(4){ animation-delay:.18s } .sec:nth-of-type(n+5){ animation-delay:.24s }

/* ---------- 7. النوافذ → شيتات سفلية بفيزياء ---------- */
@keyframes sheetIn{ from{ transform:translateY(100%) } to{ transform:none } }
@keyframes bdIn{ from{ opacity:0 } }
@media (max-width:700px){
  /* الخلفية لا تمرّر إطلاقاً — الشيت وحده هو الحاوية القابلة للتمرير */
  .modal-backdrop{ align-items:flex-end; justify-content:center; padding:0;
    overflow:hidden !important; animation:bdIn .3s ease both; }
  .modal, .modal.gd-rel{ width:100%; max-width:none; margin:0; border-bottom:0;
    border-radius:26px 26px 0 0;
    height:auto; max-height:94dvh;
    overflow-x:hidden !important; overflow-y:auto !important;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y;
    animation:sheetIn .42s var(--sp) both;
    box-shadow:0 -30px 80px -20px #000, 0 -1px 0 0 var(--hair-2); }
  .modal::before{ content:''; position:sticky; top:0; display:block; width:38px; height:4px;
    margin:9px auto 0; border-radius:9px; background:var(--hair-2); z-index:6; }
  .modal-head{ position:sticky; top:0; padding-top:8px; }
  .modal-foot{ position:sticky; bottom:0; padding-bottom:calc(14px + env(safe-area-inset-bottom)); }
  .modal-body{ padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
  .modal.guide{ padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
  /* الوهج اللوني ثابت لا يمرّر مع المحتوى */
  .gd-rel::before{ position:fixed; top:auto; }
}
.modal-head{ border-bottom:1px solid var(--hair); background:color-mix(in srgb, #0d0f1ce8 var(--bm), var(--bb)); }
.modal-foot{ border-top:1px solid var(--hair); background:color-mix(in srgb, #0d0f1ce8 var(--bm), var(--bb)); }

/* ---------- 8. أشرطة التقدّم تتعبّأ عند الظهور ---------- */
.ml-fill,.lvlbar i,.gbar-fill,.xp-fill,.cbar-fill,.pbar-fill,.status-seg{
  transition:width .9s var(--sp), height .9s var(--sp), flex-grow .9s var(--sp); }
.ml-fill,.lvlbar i,.xp-fill{ position:relative; overflow:hidden; }
.ml-fill::after,.lvlbar i::after,.xp-fill::after{
  content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,#fff9,transparent);
  transform:translateX(-100%); animation:shine 2.8s var(--ease) infinite; }
@keyframes shine{ 60%,100%{ transform:translateX(100%) } }

/* ---------- 9. الشريط السفلي: مؤشّر سائل ---------- */
.tabs{ background:color-mix(in srgb, #0d101ee0 var(--bm), var(--bb)); border-color:var(--hair-2); }
.tabs button{ position:relative; overflow:visible; }
.tabs button.on{ background:transparent; color:var(--gold); }
.tabs button.on::before{
  content:''; position:absolute; inset:2px 4px; border-radius:var(--rf);
  background:#ffffff12; box-shadow:inset 0 1px 0 #ffffff1a;
  animation:tabPop .38s var(--sp2) both; z-index:-1; }
@keyframes tabPop{ from{ transform:scale(.7); opacity:0 } }
.tabs button.on i{ animation:tabIc .42s var(--sp2) both; }
@keyframes tabIc{ 0%{ transform:scale(.8) } 55%{ transform:scale(1.22) translateY(-2px) } }

/* ---------- 10. الانتقال بين الشاشات ---------- */
::view-transition-old(root){ animation:vtOut .18s ease both; }
::view-transition-new(root){ animation:vtIn .34s var(--sp) both; }
@keyframes vtOut{ to{ opacity:0; transform:scale(.985) } }
@keyframes vtIn{ from{ opacity:0; transform:scale(1.012) } }

/* ---------- 11. الهيكل العظمي بدل السبينر ---------- */
.sk{ border-radius:12px; background:linear-gradient(100deg,#ffffff08 30%,#ffffff16 50%,#ffffff08 70%);
  background-size:220% 100%; animation:skw 1.3s linear infinite; }
@keyframes skw{ to{ background-position:-220% 0 } }

/* ---------- 12. صقل: البطل ---------- */
.hero-cover{ transform:rotate(-2.5deg); box-shadow:0 30px 60px -14px #000, 0 0 0 1px #ffffff1f, 0 0 44px -14px var(--g); }
.play{ letter-spacing:-.3px; box-shadow:0 14px 36px -10px color-mix(in srgb,var(--gold) 44%,transparent), inset 0 1px 0 #fff6; }
.play:active{ transform:scale(.96); box-shadow:0 6px 18px -8px color-mix(in srgb,var(--gold) 44%,transparent); }
.pill{ background:#ffffff08; border-color:var(--hair); backdrop-filter:blur(8px); }
.pill b{ font-family:var(--num); }

/* ---------- 13. الرتب/الشارات: لمعة موحّدة ---------- */
.rank-emoji,.brand-icon,.spinner{ filter:drop-shadow(0 6px 18px color-mix(in srgb,var(--gold) 27%,transparent)); }
.stat-n,.kpi-val,.ach-sum-cell b,.gcard-lvl,.rank-badge,.ml-num,.timer-clock,
.hero-time b,.pill b,.level-num,.ach-count,.gbar-n,.sn-xp b,.lvlfx-lv{
  font-family:var(--num); font-variant-numeric:tabular-nums; }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}


/* ════════════════════════════════════════════════════════════
   نظام الثيمات — داكن • أسود عميق • فاتح  +  لكنة قابلة للتغيير
   كل الرموز أدناه تُشتق من --acc، فتغيير لون واحد يعيد صبغ الموقع كله.
   ════════════════════════════════════════════════════════════ */
.app{
  /* قطبية اللون: في الداكن = تطابق تام (لا تغيير)، في الفاتح = قلب مضبوط */
  --tm:100%; --tb:transparent;   /* النصوص الفاتحة */
  --bm:100%; --bb:transparent;   /* الأسطح الداكنة */
  --acc:#ffc24b;

  /* الأسطح المشتقّة (الوضع الداكن) */
  --panel:#13162a; --panel-2:#0d0f1c; --surf-2:#0f111d;
  --well:#0a0c16; --well-2:#0c0e19; --card-2:#0c0e18; --deep:#07090f;
  --ink:#ffffff;
}

/* ---------- أسود عميق (OLED) ---------- */
.app[data-theme="oled"]{
  --bg:#000000; --bg-1:#050507;
  --s1:#0a0a0e; --s2:#101015; --s3:#17171f; --s4:#202029;
  --line:#1c1c26; --line-2:#282833; --line-3:#3a3a47;
  --panel:#0b0b10; --panel-2:#060609; --surf-2:#0a0a0e;
  --well:#050507; --well-2:#08080c; --card-2:#08080c; --deep:#000000;
  --hair:#ffffff10; --hair-2:#ffffff1f;
  --e1:linear-gradient(180deg,#ffffff09,#ffffff03);
  background:
    radial-gradient(1000px 560px at 80% -12%, color-mix(in srgb, var(--g, var(--acc)) 14%, transparent) 0%, transparent 55%),
    #000 !important;
}

/* ---------- فاتح ---------- */
.app[data-theme="light"]{
  --tm:46%; --tb:#000;
  --bm:7%;  --bb:#fff;
  --cyan:#0e7490; --cyan-2:#0891b2;
  --violet:#6d28d9; --violet-2:#4c1d95;
  --green:#15803d; --red:#be123c; --amber:#b45309; --ember:#c2410c;
  --bg:#f2f3f9; --bg-1:#e9ebf4;
  --s1:#ffffff; --s2:#f8f9fd; --s3:#eef0f8; --s4:#e2e5f1;
  --line:#e0e3ee; --line-2:#ccd1e0; --line-3:#adb3c8;
  --txt:#121424; --txt-2:#454b63; --txt-3:#6b7189; --txt-4:#7b8199;
  --panel:#ffffff; --panel-2:#f8f9fd; --surf-2:#eef0f8;
  --well:#f1f3fa; --well-2:#f7f8fd; --card-2:#f8f9fd; --deep:#e8ebf5;
  --ink:#121424;
  --hair:#0000000f; --hair-2:#00000020;
  --e0:#ffffffcc;
  --e1:linear-gradient(180deg,#ffffff,#fafbff);
  --sh1:0 1px 2px #0000000d;
  --sh2:0 10px 30px -14px #00000026;
  --sh3:0 28px 70px -20px #0000002e, 0 0 0 1px #00000010;
  color-scheme:light;
  background:
    radial-gradient(1100px 620px at 82% -12%, color-mix(in srgb, var(--g, var(--acc)) 18%, transparent) 0%, transparent 58%),
    radial-gradient(880px 520px at -12% 8%, #dfeaf5 0%, transparent 52%),
    var(--bg) !important;
  background-attachment:fixed;
}
/* تصحيحات ضرورية للوضع الفاتح */
.app[data-theme="light"] .tabs{ background:#ffffffe6; border-color:#00000014;
  box-shadow:0 18px 46px -14px #00000038; }
.app[data-theme="light"] .tabs button{ color:var(--txt-3); }
.app[data-theme="light"] .tabs button.on{ color:var(--gold-3); }
.app[data-theme="light"] .tabs button.on::before{ background:#00000009; }
.app[data-theme="light"] .tabs button i{ filter:none; }
.app[data-theme="light"] .modal-head,
.app[data-theme="light"] .modal-foot{ background:#ffffffef; }
.app[data-theme="light"] .modal-backdrop{ background:#1c2033a8; }
.app[data-theme="light"] .lib-h{ background:linear-gradient(var(--bg) 55%,#f2f3f9dd 80%,transparent); }
.app[data-theme="light"] .hero-fade{ background:linear-gradient(180deg,#ffffff59 0%,#ffffff26 26%,#f2f3f9e8 70%,var(--bg) 100%); }
.app[data-theme="light"] .hero-art{ filter:saturate(1.1) brightness(1); }
.app[data-theme="light"] .hero-name{ text-shadow:0 2px 14px #ffffffcc; }
.app[data-theme="light"] .brand-title{ background:linear-gradient(180deg,#121424,#4b5169); -webkit-background-clip:text; background-clip:text; }
.app[data-theme="light"] .timer-clock{ background:linear-gradient(180deg,#121424,var(--gold-3)); -webkit-background-clip:text; background-clip:text; }
.app[data-theme="light"] .hm-c{ background:#dfe3ef; }
.app[data-theme="light"] .hm-c.l0{ background:#e6e9f3; }
.app[data-theme="light"] .hm-c.l1{ background:color-mix(in srgb, var(--acc) 28%, #fff); }
.app[data-theme="light"] .hm-c.l2{ background:color-mix(in srgb, var(--acc) 52%, #fff); }
.app[data-theme="light"] .hm-c.l3{ background:color-mix(in srgb, var(--acc) 76%, #fff); }
.app[data-theme="light"] .hm-c.l4{ background:var(--acc); }
.app[data-theme="light"] .pill{ background:#ffffffb3; }
.app[data-theme="light"] .sk{ background:linear-gradient(100deg,#00000008 30%,#00000014 50%,#00000008 70%); background-size:220% 100%; }
.app[data-theme="light"] .icon-sq{ background:#ffffffcc; }
.app[data-theme="light"] .ml-fill::after,
.app[data-theme="light"] .lvlbar i::after,
.app[data-theme="light"] .xp-fill::after{ background:linear-gradient(90deg,transparent,#ffffffb3,transparent); }
.app[data-theme="light"] .card{ box-shadow:var(--sh1); }
.app[data-theme="light"] .card:hover{ box-shadow:0 20px 40px -20px #00000040; }
.app[data-theme="light"] ::selection{ background:var(--acc); color:#fff; }
.app[data-theme="light"] .qnum{ color:#fff; }
.app[data-theme="light"] .grp-head b, .app[data-theme="light"] .grp-total b{ color:var(--violet); }
.app[data-theme="light"] .gd-rel .gd-bg{ opacity:.28; }
.app[data-theme="light"] .gd-rel::before{ opacity:.12; }

/* ---------- عناصر ضبط المظهر في الإعدادات ---------- */
.th-modes{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.th-mode{ display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 6px;
  border-radius:var(--r2); border:1px solid var(--line); background:var(--s1);
  color:var(--txt-3); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; }
.th-mode i{ font-style:normal; width:100%; height:34px; border-radius:9px; border:1px solid var(--hair-2); }
.th-mode.on{ border-color:var(--acc); color:var(--txt); box-shadow:0 0 0 1px var(--acc) inset; }
.th-sw{ display:flex; flex-wrap:wrap; gap:9px; align-items:center; }
.th-dot{ width:34px; height:34px; border-radius:50%; border:2px solid transparent; cursor:pointer;
  padding:0; box-shadow:0 4px 14px -6px #0009; transition:.16s var(--sp); }
.th-dot:active{ transform:scale(.88); }
.th-dot.on{ border-color:var(--txt); box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent); }
.th-pick{ width:34px; height:34px; border-radius:50%; border:1px dashed var(--line-3); background:none;
  padding:0; cursor:pointer; position:relative; overflow:hidden; display:grid; place-items:center; font-size:15px; }
.th-pick input{ position:absolute; inset:-20%; width:140%; height:140%; opacity:0; cursor:pointer; border:0; padding:0; }
.th-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0;
  border-top:1px solid var(--line); font-size:13px; font-weight:700; color:var(--txt-2); }
.th-tog{ width:46px; height:27px; border-radius:var(--rf); border:1px solid var(--line-2); background:var(--well);
  position:relative; cursor:pointer; flex:none; transition:.2s var(--sp); }
.th-tog::after{ content:''; position:absolute; top:2px; right:2px; width:21px; height:21px; border-radius:50%;
  background:var(--txt-3); transition:.24s var(--sp); }
.th-tog.on{ background:var(--acc); border-color:transparent; }
.th-tog.on::after{ right:calc(100% - 23px); background:#fff; }

/* ---------- الرحلة ---------- */
.jr{ padding:0 16px 8px; }
.jr-f{ margin-bottom:6px; }
.jr-sum{ font-size:12px; font-weight:700; color:var(--txt-4); margin:0 2px 14px; }
.jr-month{ position:sticky; top:0; z-index:4; margin:18px 0 10px; padding:7px 0 7px 0;
  font-size:12.5px; font-weight:700; color:var(--txt-3); letter-spacing:.4px;
  background:linear-gradient(var(--bg) 62%, transparent); backdrop-filter:blur(6px); }
.jr-month::after{ content:''; display:block; height:1px; margin-top:7px;
  background:linear-gradient(to left, var(--line), transparent); }
.jr-item{ display:grid; grid-template-columns:46px 1fr; gap:12px; position:relative;
  padding-bottom:12px; cursor:pointer; animation:tileIn .45s var(--sp) both; }
.jr-item:not([onclick]){ cursor:default; }
.jr-rail{ position:relative; display:flex; justify-content:center; }
.jr-rail::before{ content:''; position:absolute; top:48px; bottom:-14px; width:2px;
  background:linear-gradient(var(--g), color-mix(in srgb, var(--g) 20%, transparent));
  opacity:.55; border-radius:2px; }
.jr-item:last-child .jr-rail::before{ display:none; }
.jr-dot{ width:46px; height:46px; border-radius:13px; overflow:hidden; flex:none; position:relative;
  display:grid; place-items:center; font-size:19px; background:var(--s2);
  border:1px solid color-mix(in srgb, var(--g) 55%, transparent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--g) 14%, transparent), 0 8px 22px -10px var(--g);
  transition:transform .2s var(--sp2); }
.jr-dot img{ width:100%; height:100%; object-fit:cover; }
.jr-item:active .jr-dot{ transform:scale(.9); }
.jr-card{ background:var(--e1); border:1px solid var(--hair); border-radius:var(--r2);
  padding:11px 13px; min-width:0; transition:.18s var(--sp); }
.jr-item:active .jr-card{ border-color:color-mix(in srgb, var(--g) 60%, transparent); }
.jr-t{ font-size:14px; font-weight:700; color:var(--txt); line-height:1.5; }
.jr-ic{ margin-left:6px; }
.jr-s{ font-size:12px; font-weight:500; color:var(--txt-3); margin-top:3px; line-height:1.6; }
.jr-n{ font-size:12px; color:var(--txt-2); margin-top:7px; padding:7px 9px; border-radius:9px;
  background:color-mix(in srgb, var(--g) 8%, transparent);
  border-right:2px solid color-mix(in srgb, var(--g) 55%, transparent); line-height:1.6; }
/* المحطات الكبرى */
.jr-item.big .jr-dot{ width:46px; height:46px;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--g) 26%, transparent), 0 10px 30px -8px var(--g);
  animation:jrPulse 3.2s ease-in-out infinite; }
@keyframes jrPulse{ 50%{ box-shadow:0 0 0 7px color-mix(in srgb, var(--g) 10%, transparent), 0 12px 34px -8px var(--g); } }
.jr-item.big .jr-card{ background:linear-gradient(180deg, color-mix(in srgb, var(--g) 11%, transparent), transparent);
  border-color:color-mix(in srgb, var(--g) 40%, transparent); }
.jr-item.big .jr-t{ font-size:15px; }

/* ---------- الملاحم ---------- */
.sagas{ padding:0 16px 8px; display:flex; flex-direction:column; gap:11px; }
.saga{ border:1px solid var(--hair); border-radius:var(--r3); overflow:hidden;
  background:linear-gradient(180deg, color-mix(in srgb, var(--g) 9%, transparent), transparent);
  animation:tileIn .45s var(--sp) both; transition:border-color .2s; }
.saga.open{ border-color:color-mix(in srgb, var(--g) 45%, transparent); }
.saga-h{ width:100%; display:flex; align-items:center; gap:12px; padding:11px 12px;
  background:none; border:0; font-family:inherit; cursor:pointer; text-align:right; color:var(--txt); }
.saga-stack{ position:relative; width:62px; height:52px; flex:none; }
.saga-stack img{ position:absolute; top:2px; width:36px; height:48px; object-fit:cover;
  border-radius:6px; border:1px solid var(--hair-2); box-shadow:0 6px 16px -8px #000; }
.saga-stack img:nth-child(1){ right:0; transform:rotate(3deg); }
.saga-stack img:nth-child(2){ right:11px; transform:rotate(-3deg); }
.saga-stack img:nth-child(3){ right:22px; transform:rotate(6deg); }
.saga-noart{ display:grid; place-items:center; width:36px; height:48px; border-radius:6px;
  background:var(--s2); font-size:17px; }
.saga-noart.sm{ width:30px; height:40px; font-size:14px; }
.saga-i{ flex:1; min-width:0; }
.saga-n{ font-size:14.5px; font-weight:700; letter-spacing:-.3px; }
.saga-m{ font-size:11.5px; font-weight:500; color:var(--txt-3); margin:2px 0 7px; }
.saga-bar{ height:5px; border-radius:9px; background:var(--well); overflow:hidden; }
.saga-bar i{ display:block; height:100%; border-radius:9px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--g) 55%, transparent), var(--g));
  transition:width .9s var(--sp); }
.saga-pct{ font-family:var(--num); font-size:13px; font-weight:700; color:var(--g); flex:none; }
.saga-list{ padding:2px 10px 10px; display:flex; flex-direction:column; gap:6px;
  animation:tileIn .3s var(--sp) both; }
.saga-g{ display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:var(--r2);
  border:1px solid var(--hair); background:var(--e1); font-family:inherit; cursor:pointer;
  text-align:right; color:var(--txt); }
.saga-g img{ width:30px; height:40px; object-fit:cover; border-radius:5px; flex:none; }
.saga-gi{ flex:1; min-width:0; }
.saga-gi b{ display:block; font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.saga-gi small{ font-size:11px; color:var(--txt-4); font-family:var(--num); }
.saga-ok{ font-size:14px; flex:none; }
.saga-lone-h{ font-size:12.5px; font-weight:700; color:var(--txt-3); margin:16px 2px 2px; }

/* ---------- المعرض ---------- */
.shots-box{ margin-top:12px; }
.shots-h{ display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700;
  color:var(--txt-2); margin-bottom:8px; }
.shots-h span{ font-family:var(--num); font-size:11px; color:var(--g); padding:1px 7px;
  border-radius:var(--rf); background:color-mix(in srgb, var(--g) 14%, transparent); }
.shots{ display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory;
  padding-bottom:4px; margin:0 -14px; padding-inline:14px; scrollbar-width:none; }
.shots::-webkit-scrollbar{ display:none; }
.shot{ flex:none; width:78%; max-width:300px; aspect-ratio:16/9; border-radius:var(--r2);
  overflow:hidden; padding:0; border:1px solid var(--hair-2); background:var(--s2);
  scroll-snap-align:center; cursor:pointer; transition:transform .18s var(--sp);
  box-shadow:0 10px 26px -14px #000; }
.shot:active{ transform:scale(.96); }
.shot img{ width:100%; height:100%; object-fit:cover; display:block; }
.lb{ position:fixed; inset:0; z-index:80; background:#04050af2; backdrop-filter:blur(14px);
  display:grid; place-items:center; padding:16px; animation:bdIn .22s ease both; }
.lb img{ max-width:100%; max-height:78dvh; border-radius:var(--r2); object-fit:contain;
  box-shadow:0 30px 80px -20px #000; animation:tileIn .3s var(--sp) both; }
.lb-n{ position:absolute; top:calc(16px + env(safe-area-inset-top)); right:18px;
  font-family:var(--num); font-size:13px; font-weight:700; color:#fff9; }
.lb-x{ position:absolute; top:calc(10px + env(safe-area-inset-top)); left:12px; width:38px; height:38px;
  border-radius:50%; border:1px solid #ffffff26; background:#ffffff12; color:#fff; font-size:16px; cursor:pointer; }
.lb-dots{ position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); display:flex; gap:6px; }
.lb-dots i{ width:6px; height:6px; border-radius:50%; background:#ffffff33; transition:.2s; }
.lb-dots i.on{ background:var(--gold); width:18px; border-radius:9px; }

/* ---------- منتقي NSO ---------- */
.np-body{ gap:10px; }
.np-q{ width:100%; }
.np-sys{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.np-sys::-webkit-scrollbar{ display:none; }
.np-sys .ft-chip{ flex:none; }
.np-sys small{ font-family:var(--num); opacity:.6; margin-right:3px; }
.np-list{ display:flex; flex-direction:column; gap:5px; }
.np-row{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--r2);
  border:1px solid var(--hair); background:var(--e1); font-family:inherit; cursor:pointer;
  text-align:right; color:var(--txt); transition:.16s var(--sp); }
.np-row:active{ transform:scale(.98); border-color:var(--gold); }
.np-row.have{ opacity:.5; }
.np-ic{ font-size:16px; flex:none; }
.np-i{ flex:1; min-width:0; }
.np-i b{ display:block; font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.np-i small{ font-size:10.5px; color:var(--txt-4); }
.np-a{ font-size:12px; font-weight:700; color:var(--gold); flex:none; }
.np-row.have .np-a{ color:var(--green); }
.np-btn{ width:100%; margin-top:2px; }

.head-acts{ display:flex; gap:7px; flex:none; }
.head-acts .icon-btn{ flex:none; }

/* ---------- الدليل ---------- */
.guide-title{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  position:sticky; top:0; z-index:5; padding:6px 0 10px;
  background:linear-gradient(var(--panel) 70%, transparent); }
.guide-lead{ font-size:12.5px; color:var(--txt-3); line-height:1.8; margin:0 0 14px; }
.guide-sec{ padding:0; overflow:hidden; transition:border-color .2s; }
.guide-sec[open]{ border-color:color-mix(in srgb, var(--gold) 40%, transparent); }
.guide-sec summary{ list-style:none; cursor:pointer; padding:12px 14px; font-size:14px;
  font-weight:700; color:var(--txt); display:flex; align-items:center; gap:8px;
  transition:color .15s; }
.guide-sec summary::-webkit-details-marker{ display:none; }
.guide-sec summary::after{ content:'⌄'; margin-inline-start:auto; font-size:15px;
  color:var(--txt-4); transition:transform .25s var(--sp); }
.guide-sec[open] summary{ color:var(--gold); }
.guide-sec[open] summary::after{ transform:rotate(180deg); }
.guide-sec summary:active{ background:var(--hair); }
.guide-in{ padding:0 14px 13px; animation:tileIn .28s var(--sp) both; }
.guide-in ul{ margin:0; padding-inline-start:18px; }
.guide-in li{ margin-bottom:6px; }
.guide-in li::marker{ color:color-mix(in srgb, var(--gold) 70%, transparent); }

/* ---------- خانة المجموعة ---------- */
.shell-check{ border:1px dashed var(--line-2); border-radius:var(--r2); padding:10px 11px;
  align-items:flex-start; transition:.2s var(--sp); }
.shell-check.on{ border-color:var(--gold); border-style:solid;
  background:color-mix(in srgb, var(--gold) 8%, transparent); }
.shell-check small{ display:block; font-size:11px; font-weight:400; color:var(--txt-4);
  margin-top:3px; line-height:1.6; }
.card.is-shell::after{ content:'📦 مجموعة'; position:absolute; bottom:0; inset-inline:0;
  font-size:9.5px; font-weight:700; text-align:center; padding:2px;
  background:color-mix(in srgb, var(--gold) 22%, transparent); color:var(--gold);
  backdrop-filter:blur(4px); }

/* ---------- خارطة الإتمام ---------- */
.atlas{ padding:0 16px 8px; }
.atl-sum{ display:flex; gap:8px; margin-bottom:12px; }
.atl-sc{ flex:1; text-align:center; padding:11px 6px; border-radius:var(--r2);
  border:1px solid var(--hair); background:var(--e1); font-size:11px; font-weight:500; color:var(--txt-3); }
.atl-sc b{ display:block; font-family:var(--num); font-size:20px; font-weight:700; color:var(--gold); margin-bottom:2px; }
.atl-f{ margin-bottom:14px; }
.atl{ border:1px solid var(--hair); border-radius:var(--r3); padding:13px; margin-bottom:11px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--g) 7%, transparent), transparent);
  animation:tileIn .45s var(--sp) both; transition:border-color .2s; }
.atl.done{ border-color:color-mix(in srgb, var(--g) 45%, transparent);
  background:linear-gradient(180deg, color-mix(in srgb, var(--g) 13%, transparent), transparent); }
.atl-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px; }
.atl-t{ display:flex; align-items:center; gap:8px; min-width:0; }
.atl-t b{ font-size:15px; font-weight:700; letter-spacing:-.3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.atl-crown{ font-size:10px; font-weight:700; color:var(--g); flex:none; padding:2px 7px; border-radius:var(--rf);
  background:color-mix(in srgb, var(--g) 16%, transparent); }
.atl-frac{ font-family:var(--num); font-size:14px; font-weight:700; color:var(--txt-3); flex:none; }
.atl-frac b{ color:var(--g); font-size:17px; }
.atl-seg{ display:flex; height:7px; border-radius:9px; overflow:hidden; background:var(--well); gap:2px; margin-bottom:11px; }
.atl-seg i{ display:block; border-radius:2px; min-width:3px; transition:flex-grow .9s var(--sp); }
.atl-seg .sd{ background:linear-gradient(90deg, color-mix(in srgb,var(--g) 60%,transparent), var(--g)); }
.atl-seg .sp{ background:var(--cyan); }
.atl-seg .ss{ background:var(--line-2); }
.atl-nodes{ display:flex; flex-wrap:wrap; gap:7px; }
.atl-node{ position:relative; width:38px; height:50px; border-radius:8px; overflow:hidden; padding:0;
  border:1px solid var(--hair-2); background:var(--s2); cursor:pointer; flex:none;
  transition:transform .16s var(--sp); }
.atl-node:active{ transform:scale(.9); }
.atl-node img{ width:100%; height:100%; object-fit:cover; display:block; }
.atl-node.sleep img{ filter:grayscale(1) brightness(.5); }
.atl-node.sleep span{ opacity:.4; }
.atl-node span{ display:grid; place-items:center; width:100%; height:100%; font-size:15px; }
.atl-mark{ position:absolute; bottom:0; inset-inline:0; text-align:center; font-size:10px; font-weight:700;
  font-style:normal; line-height:1.5; color:#fff; backdrop-filter:blur(3px); }
.atl-node.done .atl-mark{ background:color-mix(in srgb, var(--g) 78%, transparent); color:var(--gold-ink); }
.atl-node.playing{ border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan); }
.atl-node.playing .atl-mark{ background:color-mix(in srgb, var(--cyan) 82%, transparent); color:#062a33; }
