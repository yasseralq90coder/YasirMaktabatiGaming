name: بناء APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'games_db.js', 'vendor/**', 'icon.svg', 'manifest.json', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write          # لإنشاء الإصدار ورفع الـAPK إليه

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # يُقيَّم مرّة على مستوى المهمّة: سياق secrets غير متاح في if الخطوة
      HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }     # عدّ الكوميتات يحتاج التاريخ كاملًا

      # مصدر واحد: تُنسخ أصول الويب كما هي وقت البناء.
      # لا نسخة ثانية من index.html في المستودع.
      - name: تجهيز أصول الويب
        run: |
          mkdir -p assets-build/vendor
          cp index.html games_db.js icon.svg manifest.json assets-build/
          # React محلي: بدونه شاشة سوداء عند أول تشغيل بلا شبكة
          cp vendor/*.js assets-build/vendor/
          ls -lh assets-build

      # APK بجافاسكربت مكسور يُثبَّت ولا يعمل — الفحص قبل البناء لا بعده
      - name: فحص صيغة تطبيق الويب والاختبارات
        run: |
          awk '/^<script>$/{f=1;next}/<\/script>/{f=0}f' index.html > /tmp/app.js
          node --check /tmp/app.js
          node --check sw.js
          node tests/run.cjs

      # AndroidManifest مكسور يفشل بعد ثلاث دقائق من البناء برسالة
      # "Error parsing" لا تقول أين. xmllint يقولها في ثانية.
      - name: فحص صيغة XML
        run: |
          sudo apt-get install -y libxml2-utils >/dev/null 2>&1 || true
          fail=0
          for f in $(find android/app/src/main -name "*.xml"); do
            xmllint --noout "$f" || { echo "XML مكسور: $f"; fail=1; }
          done
          [ "$fail" = "0" ] && echo "كل ملفات XML سليمة" || exit 1

      - name: ترقيم الإصدار
        id: ver
        run: |
          # versionCode = عدد الكوميتات: يتزايد حتمًا ولا يتكرّر ولا يتراجع
          echo "code=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
          echo "name=1.$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }

      - uses: android-actions/setup-android@v3

      # ⚠️ بلا هذا السرّ يُوقَّع الـAPK بمفتاح تصحيح عشوائي لكل بناء،
      # فيرفض أندرويد تحديثه ويُجبر المستخدم على الحذف وفقدان بياناته.
      - name: فكّ مفتاح التوقيع
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: بناء APK
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PATH: ${{ env.HAS_KEY == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: maktabati
        run: |
          gradle wrapper --gradle-version 8.7 --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: تأكيد التوقيع
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p out && cp "$APK" "out/maktabati-v${{ steps.ver.outputs.name }}.apk"
          # ⚠️ بصمة الموقِّع يجب أن تبقى واحدة في كل بناء — اختلافها يعني أن
          #    التحديث القادم سيُرفض ويُجبر المستخدم على الحذف.
          # المسار يُختار صراحةً: التوسيع بنجمة يعطي أكثر من نسخة فيبتلع الأمر
          # مسارًا كوسيط ويفشل بصمت (وقع فعلًا في بناء سابق).
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $SIGNER"
          "$SIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1
          # فشل التحقّق يوقف البناء: ناتجٌ لا نعرف بأي مفتاح وُقّع لا قيمة له
          "$SIGNER" verify "$APK"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/*.apk, retention-days: 90 }

      - name: تحذير — بناء بلا مفتاح ثابت
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::لا يوجد سرّ KEYSTORE_B64 — وُقّع الـAPK بمفتاح تصحيح عشوائي."
          echo "::warning::هذا الناتج للفحص فقط: تثبيته يمنع أي تحديث لاحق ويفرض الحذف."

      # إصدار دائم: الأثر يُحذف بعد 90 يومًا، والإصدار يبقى برابط ثابت.
      # لا يُنشر إلا بمفتاح ثابت — وإلا أغرى بتثبيت نسخة لا تُحدَّث.
      - name: نشر الإصدار
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: مكتبتي الجيمرية v${{ steps.ver.outputs.name }}
          files: out/*.apk
          generate_release_notes: true
