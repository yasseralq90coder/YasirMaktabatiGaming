name = "gamelib-timer-push"
main = "src/index.js"
compatibility_date = "2024-11-01"

# كل دقيقة: أدقّ ما يتيحه cron في Cloudflare، ويكفي لتذكير كل 5 دقائق
[triggers]
crons = ["* * * * *"]

# أنشئ الفضاء بـ: wrangler kv namespace create REMINDERS
# ثم ضع المعرّف هنا
[[kv_namespaces]]
binding = "REMINDERS"
id = "ضع-معرّف-الفضاء-هنا"

[vars]
VAPID_SUBJECT = "mailto:hr.records.center@gmail.com"
