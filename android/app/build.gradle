plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
}

android {
  namespace "com.yasir.maktabati"
  compileSdk 35

  defaultConfig {
    applicationId "com.yasir.maktabati"
    minSdk 26            // أندرويد 8 — أدنى إصدار فيه قنوات الإشعارات
    targetSdk 35
    /* ⚠️ يتزايد مع كل بناء. رقم ثابت يعني أن أندرويد لا يرى نسخة أحدث
       فيرفض التحديث — ولا رسالة خطأ مفهومة، فقط «لم يُثبَّت التطبيق». */
    /* ⚠️ إسناد بـ= لا استدعاء. في Groovy تُفسَّر `versionCode (x).toInteger()`
       كـ`versionCode(x)` ثم `.toInteger()` على ناتجها — فيصل الرقم نصًّا
       وتُستدعى toInteger على null، والرسالة «Value is null» لا تدلّ على السبب. */
    versionCode = (System.getenv("VERSION_CODE") ?: "1") as Integer
    versionName = System.getenv("VERSION_NAME") ?: "1.0"
  }

  // BuildConfig.DEBUG يحتاج تفعيلًا صريحًا منذ AGP 8
  buildFeatures { buildConfig true }

  /* ⚠️ **مفتاح ثابت أو لا تحديث أبدًا.** مُشغّل GitHub مؤقّت، فـGradle يولّد
     مفتاح تصحيح جديدًا عشوائيًا في كل بناء. وأندرويد يرفض تحديثًا بمفتاح
     مختلف عن المثبَّت — فيُجبر المستخدم على الحذف، وتضيع بياناته.
     المفتاح يأتي من أسرار المستودع؛ وبدونها يسقط للتصحيح ليبقى البناء
     المحلي ممكنًا، لكن **ناتجه لا يصلح للتحديث**. */
  signingConfigs {
    release {
      def ksPath = System.getenv("KEYSTORE_PATH")
      if (ksPath && file(ksPath).exists()) {
        storeFile file(ksPath)
        storePassword System.getenv("KEYSTORE_PASSWORD")
        keyAlias System.getenv("KEY_ALIAS") ?: "maktabati"
        keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
      }
    }
  }

  buildTypes {
    release {
      // بلا تصغير: الأصول HTML/JS لا يمسّها R8، والكود الأصلي بضع مئات الأسطر
      minifyEnabled false
      signingConfig = System.getenv("KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }
  // الأصول تُنسخ من جذر المستودع — مصدرٌ واحد لا نسختان
  sourceSets { main { assets.srcDirs += ["$rootDir/../assets-build"] } }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.webkit:webkit:1.11.0"
}
