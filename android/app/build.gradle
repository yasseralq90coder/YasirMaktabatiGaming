plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
}

android {
  namespace "com.yasir.maktabati"
  compileSdk 35

  defaultConfig {
    applicationId "com.yasir.maktabati"
    minSdk 26            // أندرويد 8 — أدنى إصدار فيه قنوات الإشعارات
    targetSdk 35
    versionCode 1
    versionName "1.0"
  }

  // BuildConfig.DEBUG يحتاج تفعيلًا صريحًا منذ AGP 8
  buildFeatures { buildConfig true }

  buildTypes {
    release {
      // بلا تصغير: الأصول HTML/JS لا يمسّها R8، والكود الأصلي بضع مئات الأسطر
      minifyEnabled false
      signingConfig signingConfigs.debug   // يُستبدل في CI بمفتاح حقيقي إن وُجد
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }
  // الأصول تُنسخ من جذر المستودع — مصدرٌ واحد لا نسختان
  sourceSets { main { assets.srcDirs += ["$rootDir/../assets-build"] } }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.webkit:webkit:1.11.0"
}
